/* =====================  Schriftgröße der Forderung einpassen  =====================
   Forderung: zweizeilig, so groß wie möglich (bis HEAD_MAX) – die breitere der Zeilen füllt die Textbreite.
   Würde sie zweizeilig kleiner als HEAD_MIN, wird sie dreizeilig gesetzt (bis HEAD_MAX_3), sofern das größer ausfällt.
   Erklärung: feste Schriftgröße (--body-size im CSS), Umbruch automatisch durch den Browser. */
function fitText(scope = document) {
  // Erst alle Breiten lesen, dann alle Größen setzen und danach einmal messen.
  // So erzwingt der Browser einen Layout-Durchlauf statt einen je Bild.
  // scope: ein Element (z. B. document) oder eine Liste von Beiträgen (beim Aufbau in Etappen nur die neuen).
  const slides = Array.isArray(scope) ? scope.flatMap(el => [...el.querySelectorAll('.slide')]) : [...scope.querySelectorAll('.slide')];
  const aktiv = slides
    .map(s => { const head = s.querySelector('.head'); return { W: s.clientWidth, head, v2: head.querySelector('.v2'), v3: head.querySelector('.v3') }; })
    .filter(x => x.W);
  aktiv.forEach(x => { x.head.style.fontSize = '100px'; x.head.classList.remove('head-3'); x.v3.style.display = 'block'; });   // Messung bei bekannter Größe, beide Fassungen sichtbar
  aktiv.forEach(x => { x.b2 = x.v2.offsetWidth; x.b3 = x.v3.offsetWidth; });
  aktiv.forEach(({ W, head, v3, b2, b3 }) => {
    const avail = W * (100 - 2 * PAD) / 100, cqw = W / 100;
    const s2 = Math.min(HEAD_MAX, 100 * avail / b2 / cqw), s3 = Math.min(HEAD_MAX_3, 100 * avail / b3 / cqw);
    const drei = s2 < HEAD_MIN && s3 > s2;
    v3.style.display = '';
    head.classList.toggle('head-3', drei);
    head.style.fontSize = (drei ? s3 : s2) + 'cqw';
  });
}
if (document.fonts) {   // nach dem Laden der Schriften neu einpassen (Textbreiten hängen von der Schrift ab)
  Promise.all(['900 1em "Work Sans"'].map(f => document.fonts.load(f))).then(() => fitText(), () => fitText());
  document.fonts.ready.then(() => fitText());
}

/* =====================  Wischbare Bildbereiche: sofortiger Bildwechsel + Punkte  ===================== */

// Jede seitliche Wischbewegung (Touch, Stift, seitliches Scrollen am Trackpad / mit Shift + Mausrad) schaltet sofort
// genau ein Bild weiter bzw. zurück – ohne Mitziehen und ohne Gleiten, nur mit kurzer Überblendung (--blende-dauer im CSS).
// Vertikales Wischen bleibt unberührt. Die Bildleiste ist per CSS nicht nativ scrollbar (overflow-x: hidden):
// Es gibt nur zwei Ergebnisse – nichts passiert, oder das nächste bzw. vorherige Bild steht vollständig da.
const SWIPE_SCHWELLE = 24;    // px seitlicher Weg, ab dem eine deutlich waagerechte Bewegung schon während des Wischens umschaltet
const SWIPE_STEIL = 1.5;      // so viel waagerechter als senkrecht muss die Bewegung dafür sein
const SWIPE_ENDE = 36;        // px seitlicher Weg, der beim Loslassen noch zählt, auch wenn die Seite dabei etwas senkrecht gescrollt hat
const SWIPE_ENDE_STEIL = 1.2; // Verhältnis waagerecht : senkrecht beim Loslassen
const RAD_SCHWELLE = 20;      // px summiertes seitliches Scrollen (Trackpad / Shift + Mausrad), ab dem eine Geste umschaltet
const RAD_PAUSE = 160;        // ms ohne Scroll-Ereignis: danach beginnt eine neue Geste

// Richtet einen Beitrag ein (Wischen, Punkte). Wird für jeden Beitrag aufgerufen, sobald er im Feed erscheint.
const einrichtenBeitrag = post => {
  const slider = post.querySelector('.slider');
  const slides = [...slider.querySelectorAll('.slide')];
  const dots = [...post.querySelectorAll('.dot')];
  let current = 0;

  const wrap = slider.parentElement;   // .slider-wrap: hier liegt die ausblendende Kopie des bisherigen Bildes
  const reduziert = matchMedia('(prefers-reduced-motion: reduce)');
  const blende = alt => {
    wrap.querySelectorAll('.blende').forEach(g => g.remove());   // schnelle Folge: nur die jüngste Überblendung bleibt
    if (!alt || reduziert.matches) return;
    const kopie = alt.cloneNode(true);
    kopie.querySelectorAll('img').forEach(i => { i.loading = 'eager'; });
    const g = document.createElement('div');
    g.className = 'blende';
    g.setAttribute('aria-hidden', 'true');
    g.appendChild(kopie);
    wrap.appendChild(g);
    g.addEventListener('animationend', () => g.remove(), { once: true });
    setTimeout(() => g.remove(), 800);   // Sicherheitsnetz, falls animationend ausbleibt
  };

  const gehe = dir => {   // dir: 1 = nächstes Bild, -1 = vorheriges Bild (am Rand passiert nichts)
    const w = slider.clientWidth;
    if (!w) return;
    const idx = Math.round(slider.scrollLeft / w);
    const ziel = Math.max(0, Math.min(slides.length - 1, idx + dir));
    if (ziel === idx) return;
    blende(slides[idx]);
    slider.scrollTo({ left: ziel * w, behavior: 'instant' });
  };

  // Touch: über Touch-Ereignisse statt Pointer-Ereignisse. Übernimmt der Browser eine leicht schräge Geste als senkrechtes
  // Scrollen, bricht er Pointer-Ereignisse ab (pointercancel) – Touch-Ereignisse laufen dagegen bis zum Loslassen weiter.
  // Deutlich waagerecht: Wechsel schon während der Bewegung. Sonst entscheidet beim Loslassen der Gesamtweg.
  let beruehrung = null;   // { x, y, fertig } der laufenden Ein-Finger-Berührung
  const wischWeg = t => ({ dx: t.clientX - beruehrung.x, dy: t.clientY - beruehrung.y });
  slider.addEventListener('touchstart', e => {
    beruehrung = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, fertig: false } : null;   // zwei Finger (Zoomen): kein Wischen
  }, { passive: true });
  slider.addEventListener('touchmove', e => {
    if (!beruehrung || beruehrung.fertig) return;
    if (e.touches.length !== 1) { beruehrung = null; return; }
    const { dx, dy } = wischWeg(e.touches[0]);
    if (Math.abs(dx) < SWIPE_SCHWELLE || Math.abs(dx) < SWIPE_STEIL * Math.abs(dy)) return;
    beruehrung.fertig = true;              // pro Berührung genau ein Bildwechsel
    gehe(dx < 0 ? 1 : -1);
  }, { passive: true });
  slider.addEventListener('touchend', e => {
    if (beruehrung && !beruehrung.fertig && e.touches.length === 0 && e.changedTouches.length) {
      const { dx, dy } = wischWeg(e.changedTouches[0]);
      if (Math.abs(dx) >= SWIPE_ENDE && Math.abs(dx) >= SWIPE_ENDE_STEIL * Math.abs(dy)) gehe(dx < 0 ? 1 : -1);
    }
    if (e.touches.length === 0) beruehrung = null;
  }, { passive: true });
  slider.addEventListener('touchcancel', () => { beruehrung = null; }, { passive: true });

  // Stift (ohne Touch-Ereignisse): Wechsel, sobald die Bewegung deutlich waagerecht ist
  let stift = null;
  slider.addEventListener('pointerdown', e => {
    stift = e.pointerType === 'pen' ? { id: e.pointerId, x: e.clientX, y: e.clientY } : null;
  });
  slider.addEventListener('pointermove', e => {
    if (!stift || e.pointerId !== stift.id) return;
    const dx = e.clientX - stift.x, dy = e.clientY - stift.y;
    if (Math.abs(dx) < SWIPE_SCHWELLE || Math.abs(dx) < SWIPE_STEIL * Math.abs(dy)) return;
    stift = null;
    gehe(dx < 0 ? 1 : -1);
  });
  slider.addEventListener('pointerup', () => { stift = null; });
  slider.addEventListener('pointercancel', () => { stift = null; });

  // Trackpad / Mausrad (seitlich): ein Bildwechsel je Geste. Eine Geste endet nach RAD_PAUSE ohne Ereignis.
  // Das Nachlaufen der Trägheit wird stetig schwächer – springt das seitliche Scrollen dagegen deutlich an
  // oder wechselt kräftig die Richtung, ist das ein neuer Wischer und schaltet erneut (statt verloren zu gehen).
  let rad = null;   // { x, y, fertig, letzt, betrag, spitze, abklingend, richtung } der laufenden Geste
  slider.addEventListener('wheel', e => {
    const faktor = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? slider.clientWidth : 1;   // Zeilen / Seiten in px umrechnen
    const ex = e.deltaX * faktor, ey = e.deltaY * faktor;
    const jetzt = performance.now(), betrag = Math.abs(ex), richtung = Math.sign(ex);
    const neu = !rad || jetzt - rad.letzt > RAD_PAUSE
      || (rad.fertig && rad.abklingend && betrag > 15 && betrag > 2.5 * rad.betrag)   // neuer Schwung, nachdem der alte schon abklang
      || (rad.fertig && betrag > 15 && richtung && rad.richtung && richtung !== rad.richtung);   // kräftiger Richtungswechsel
    if (neu) rad = { x: 0, y: 0, fertig: false, letzt: jetzt, betrag: 0, spitze: 0, abklingend: false, richtung: 0 };
    rad.x += ex; rad.y += ey; rad.letzt = jetzt;
    if (betrag) {
      rad.betrag = betrag; rad.richtung = richtung;
      rad.spitze = Math.max(rad.spitze, betrag);
      if (betrag < 0.6 * rad.spitze) rad.abklingend = true;   // Schwung hat seinen Höhepunkt überschritten
    }
    if (Math.abs(rad.x) <= Math.abs(rad.y)) return;   // überwiegend senkrecht: Seite scrollt normal weiter
    e.preventDefault();                                // waagerecht: kein Zurück-Wischen des Browsers, keine Seitenverschiebung
    if (rad.fertig || Math.abs(rad.x) < RAD_SCHWELLE) return;
    rad.fertig = true;
    gehe(rad.x > 0 ? 1 : -1);
  }, { passive: false });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const idx = slides.indexOf(e.target);
      if (idx === current) return;
      current = idx;
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    });
  }, { root: slider, threshold: 0.6 });

  slides.forEach(s => io.observe(s));

  // Maus: Pfeil-Buttons links und rechts am Bild; am ersten bzw. letzten Bild verschwindet der jeweilige Pfeil
  const pfeilL = wrap.querySelector('.pfeil-l'), pfeilR = wrap.querySelector('.pfeil-r');
  const pfeileZeigen = () => {
    const w = slider.clientWidth;
    if (!w) return;
    const idx = Math.round(slider.scrollLeft / w);
    pfeilL.hidden = idx <= 0;
    pfeilR.hidden = idx >= slides.length - 1;
  };
  pfeilL.addEventListener('click', () => gehe(-1));
  pfeilR.addEventListener('click', () => gehe(1));
  slider.addEventListener('scroll', pfeileZeigen, { passive: true });

  // Tastatur: Bildbereich per Tab erreichbar, Pfeiltasten blättern
  slider.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); gehe(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); gehe(-1); }
  });
};

/* =====================  Aufbau in Etappen  =====================
   Die Platzhalter aus dem HTML sind schon sichtbar. Zuerst erscheinen die ersten Beiträge,
   danach folgen die übrigen in kleinen Schritten, wenn der Browser gerade Zeit hat.
   So muss nicht der ganze Feed fertig gebaut sein, bevor etwas zu sehen ist. */
const FEED = document.getElementById('feed');

/* =====================  Bilder nur in der Nähe laden (Arbeitsspeicher)  =====================
   iOS Safari beendet den Tab, wenn zu viele große Bilder gleichzeitig im Speicher liegen (jedes Beitragsbild belegt
   dekodiert rund 5,6 MB). Deshalb tragen nur die gerade sichtbaren Beiträge und einige davor und danach (BILD_VORAUS, BILD_ZURUECK)
   ihre Bilder (src). Alle übrigen haben die Adresse nur in data-src; verlässt ein Beitrag das Fenster, wird sein src
   wieder entfernt und der Browser gibt das Bild frei (zu sehen ist dann die Platzhalterfarbe, wie beim ersten Laden).
   Innerhalb des Fensters lädt das erste Bild jedes Beitrags sofort, die weiteren (seitlich) wegen loading="lazy" erst beim Blättern.
   Neue oder entfernte Beiträge (Aufbau in Etappen, Filter, Suche) erfasst ein MutationObserver von selbst. */
// In Scrollrichtung werden mehr Beiträge vorgeladen als dahinter behalten (4 voraus, 1 zurück), damit beim
// schnellen Scrollen das Bild schon fertig ist, wenn der Beitrag ins Bild kommt.
const BILD_VORAUS = 4, BILD_ZURUECK = 1;
const bildSichtbar = new Set();   // Beiträge, die gerade (teilweise) im Bildschirm liegen
const bildGeladen = new Set();    // Beiträge, deren Bilder gerade ein src haben
const bilderSetzen = (post, an) => {
  // nur die Bilder im Slider selbst; die kurzlebige Kopie der Überblendung (.blende) bleibt unberührt
  post.querySelectorAll('.slider .slide img[data-src]').forEach(img => {
    if (an) { if (img.getAttribute('src') !== img.dataset.src) img.setAttribute('src', img.dataset.src); }
    else if (img.hasAttribute('src')) { img.removeAttribute('src'); img.parentElement.classList.add('wartet'); }
  });
  an ? bildGeladen.add(post) : bildGeladen.delete(post);
};
// Bild geladen und dekodiert: erst jetzt Schrift und Verlauf zeigen (.wartet, siehe CSS) – alles erscheint auf einmal
const bildFertig = e => {
  const img = e.target, slide = img.parentElement;
  if (img.tagName !== 'IMG' || !slide || !slide.classList.contains('wartet')) return;
  const zeigen = () => { if (img.getAttribute('src')) slide.classList.remove('wartet'); };
  if (e.type === 'error' || !img.decode) return zeigen();
  img.decode().then(zeigen, zeigen);
  setTimeout(zeigen, 1000);   // Sicherheitsnetz: decode() kann in einem Hintergrund-Tab ausbleiben, der Text soll nie fehlen
};
FEED.addEventListener('load', bildFertig, true);    // load/error steigen nicht auf, daher in der Capture-Phase
FEED.addEventListener('error', bildFertig, true);
let bildErsterVorher = -1, bildRichtung = 1;        // 1 = nach unten, -1 = nach oben
function bildFensterAktualisieren() {
  const posts = [...FEED.children].filter(el => el.classList.contains('post'));
  let erster = -1, letzter = -1;
  posts.forEach((el, i) => { if (bildSichtbar.has(el)) { if (erster < 0) erster = i; letzter = i; } });
  if (erster < 0) return;   // nichts sichtbar (z. B. kurz während eines Ansichtswechsels): Zustand beibehalten
  if (bildErsterVorher >= 0 && erster !== bildErsterVorher) bildRichtung = erster > bildErsterVorher ? 1 : -1;
  bildErsterVorher = erster;
  const von = erster - (bildRichtung > 0 ? BILD_ZURUECK : BILD_VORAUS);
  const bis = letzter + (bildRichtung > 0 ? BILD_VORAUS : BILD_ZURUECK);
  posts.forEach((el, i) => {
    const an = i >= von && i <= bis;
    if (an !== bildGeladen.has(el)) bilderSetzen(el, an);
  });
}
const bildBeobachter = new IntersectionObserver(entries => {
  entries.forEach(e => e.isIntersecting ? bildSichtbar.add(e.target) : bildSichtbar.delete(e.target));
  bildFensterAktualisieren();
});
new MutationObserver(mutationen => {
  mutationen.forEach(m => {
    m.addedNodes.forEach(n => { if (n.classList && n.classList.contains('post')) bildBeobachter.observe(n); });
    m.removedNodes.forEach(n => {
      if (!n.classList || !n.classList.contains('post')) return;
      bildBeobachter.unobserve(n);
      bildSichtbar.delete(n);
      if (bildGeladen.has(n)) bilderSetzen(n, false);   // herausgenommener Beitrag: Bilder sofort freigeben
    });
  });
  // Positionen haben sich verschoben: Fenster sofort (noch vor dem Zeichnen) neu bestimmen, damit z. B. ein beim
  // Ansichtswechsel ersetzter Beitrag sein Bild ohne Aufblitzen der Platzhalterfarbe behält
  bildFensterAktualisieren();
}).observe(FEED, { childList: true });

const ERSTE_ETAPPE = 2;   // so viele Beiträge erscheinen sofort
const ETAPPE = 4;         // danach je so viele Beiträge pro Schritt

const idle = f => window.requestIdleCallback ? requestIdleCallback(f, { timeout: 500 }) : setTimeout(f, 30);

let ANSICHT = POSTS;   // Beiträge, die der Feed gerade zeigt (alle oder nach Kategorie gefiltert), in Feed-Reihenfolge
let lauf = 0;          // zählt bei jedem Ansichtswechsel hoch und beendet so das Nachladen der vorherigen Ansicht

function beitraegeZeigen(von, bis, ersetzen = false) {
  const html = ANSICHT.slice(von, bis).map((p, i) => postHTML(p, von + i)).join('');
  if (ersetzen) FEED.innerHTML = html;            // entfernt die Platzhalter
  else FEED.insertAdjacentHTML('beforeend', html);
  const neu = [...FEED.querySelectorAll('.post')].slice(von);
  neu.forEach(einrichtenBeitrag);
  fitText(neu);   // nur die neuen Beiträge einpassen (früher der ganze Feed bei jeder Etappe: am Ende ~1000 Folien je Schritt)
  neu.forEach((el, i) => trefferZeigen(el, ANSICHT[von + i]));   // Suche: Treffer-Punkte markieren, passendes Bild vorn
  paintHearts();   // Herz-Buttons der neuen Beiträge mit den bekannten Zahlen füllen
}

beitraegeZeigen(0, Math.min(ERSTE_ETAPPE, ANSICHT.length), true);
document.getElementById('app').setAttribute('aria-busy', 'false');

const weitere = (von, nr = lauf) => {
  if (nr !== lauf || von >= ANSICHT.length) return;
  // Während das Story-Karussell bewegt wird, warten: Safari hat kein requestIdleCallback, jede Etappe würde das Wischen kurz stocken lassen
  if (performance.now() < storyBewegtBis) { setTimeout(() => weitere(von, nr), 200); return; }
  const bis = Math.min(von + ETAPPE, ANSICHT.length);
  beitraegeZeigen(von, bis);
  idle(() => weitere(bis, nr));
};
idle(() => weitere(ERSTE_ETAPPE, 0));

/* =====================  Filtern über die Logos  =====================
   Kategorie-Logo (1205–1209.svg, oben links): Der Feed zeigt nur noch Beiträge dieser Kategorie (maßgeblich ist die erste Forderung eines Beitrags).
   Ecklogo (1210.svg, oben rechts): Der Feed zeigt wieder alle Beiträge, in neu ausgeloster Reihenfolge wie beim Neuladen der Seite.
   Die Ansicht bleibt dabei stehen: Der angetippte Beitrag bleibt unverändert (gleiches Bild, gleiche Herzen) an derselben Stelle
   auf dem Bildschirm und in derselben Spalte, nur die Beiträge davor und danach werden ausgetauscht. */
const kategorieVon = p => p.kategorie;
const neuGemischt = liste => liste
  .map(p => ({ p, wert: (RANK.cMin + Math.random() * (RANK.cMax - RANK.cMin)) * ((p.hearts || 0) + RANK.sharedWeight * p.shared) }))
  .sort((a, b) => b.wert - a.wert)
  .map(x => x.p);

function ansichtWechseln(postEl, filter) {
  const posts = [...FEED.querySelectorAll('.post')];
  const index = posts.indexOf(postEl);
  const gezeigt = ANSICHT[index];
  if (!gezeigt) return;
  const p = gezeigt.basis || gezeigt;   // Suchansicht: Beitrag mit allen Bildern statt nur der Treffer
  const oben = postEl.getBoundingClientRect().top;   // Lage auf dem Bildschirm, die erhalten bleiben soll
  if (gezeigt !== p) {   // Suche beenden; der angetippte Beitrag zeigt wieder alle Bilder, das gerade sichtbare bleibt stehen
    const nrJetzt = currentForderung(postEl.querySelector('.slider')).nr;
    const tpl = document.createElement('template');
    tpl.innerHTML = postHTML(p, index).trim();
    const el = tpl.content.firstElementChild;
    postEl.replaceWith(el);
    postEl = el;
    einrichtenBeitrag(el);
    trefferZeigen(el, { ...p, start: Math.max(0, p.slides.findIndex(f => String(f.nr) === nrJetzt)) });
  }
  if (SUCHE) sucheBeendet();
  const spalten = getComputedStyle(FEED).display === 'grid'
    ? getComputedStyle(FEED).gridTemplateColumns.split(' ').length : 1;

  const rest = filter
    ? POSTS.filter(q => q !== p && kategorieVon(q) === filter)
    : neuGemischt(POSTS.filter(q => q !== p));
  // Möglichst gleich viele Beiträge davor wie bisher, mindestens aber dieselbe Spalte
  let davor = Math.min(index, rest.length);
  while (davor > 0 && davor % spalten !== index % spalten) davor--;

  lauf++;
  ANSICHT = [...rest.slice(0, davor), p, ...rest.slice(davor)];
  posts.forEach(el => { if (el !== postEl) el.remove(); });
  postEl.insertAdjacentHTML('beforebegin', ANSICHT.slice(0, davor).map((q, i) => postHTML(q, i + 1)).join(''));
  [...FEED.querySelectorAll('.post')].slice(0, davor).forEach(einrichtenBeitrag);
  fitText(FEED);
  paintHearts();
  window.scrollBy({ top: postEl.getBoundingClientRect().top - oben, behavior: 'instant' });
  const nr = lauf;   // beim Planen festhalten: ein schneller zweiter Wechsel beendet dieses Nachladen
  idle(() => weitere(davor + 1, nr));
}

FEED.addEventListener('click', e => {
  const logo = e.target.closest('.kat');
  if (logo) ansichtWechseln(logo.closest('.post'), logo.dataset.filter);
});
FEED.addEventListener('keydown', e => {
  const logo = e.target.closest('.kat');
  if (!logo || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  ansichtWechseln(logo.closest('.post'), logo.dataset.filter);
});

/* =====================  Suche  =====================
   Öffnet sich über das Symbol 1211.svg (data-action="suche", direkt links neben 1203.svg), über die Taste „/“ oder Strg/⌘ + K.
   Durchsucht alle Forderungen aus forderungen.js (Forderung = „head“, Erklärung = „text“), live bei jeder Eingabe.
   Abfragesprache (steht auch als Suchhilfe im Fenster):
     miete wohnung        alle Begriffe müssen vorkommen (UND)
     bus | bahn           einer der Begriffe genügt (auch: bus oder bahn)
     "16 Euro"            genaue Wortfolge (auch „…“)
     -studierende         Forderungen mit diesem Begriff ausschließen
     titel:  text:        nur in der Forderung bzw. nur in der Erklärung suchen; kategorie: sucht im Namen der Kategorie
     #12  #10-20  #3,7    nach Forderungsnummer(n)
   Groß-/Kleinschreibung, Umlaute (ä = ae = a), ß = ss, Gendersternchen, Bindestriche und Tausenderpunkte spielen keine Rolle.
   Teilwörter werden gefunden („miete“ findet „Kaltmiete“); Optionen: nur Wortanfänge / nur ganze Wörter.
   Findet ein Begriff gar nichts, wird mit Tippfehler-Toleranz gesucht (ähnliche Schreibweisen werden angezeigt).
   SUCH_SYNONYME: gleichwertige Begriffe, die automatisch mitgesucht werden (nur bei genau diesem Suchwort).
   Ergebnis: Trefferliste mit markierten Fundstellen und Anzahl je Kategorie. „Im Feed zeigen“ filtert den Feed auf die Beiträge
   mit Treffern (wahlweise nur die passenden Bilder oder ganze Beiträge mit markierten Punkten); ein Tipp auf einen Treffer stellt
   dessen Beitrag an den Anfang. Der Suchzustand steht in der Adresse (#suche=…), so lässt sich eine Suche als Link weitergeben. */
const SUCH_SYNONYME = [
  ['öpnv', 'nahverkehr'],
  ['krankenhaus', 'klinik'],
  ['auto', 'pkw'],
  ['fahrrad', 'radverkehr'],
  ['azubi', 'auszubildende'],
  ['geflüchtete', 'flüchtling'],
  ['kommune', 'gemeinde'],
];
const S_GEWICHT = { head: 4, text: 1, sektion: 1.5 };   // Gewicht einer Fundstelle je Feld (für die Sortierung nach Relevanz)
const S_SEITE = 50;                                      // so viele Treffer zeigt die Liste auf einmal
const S_FELD_ALIAS = {
  titel: 'head', forderung: 'head', ueberschrift: 'head', 'überschrift': 'head', head: 'head',
  text: 'text', erklaerung: 'text', 'erklärung': 'text', body: 'text',
  kategorie: 'sektion', kat: 'sektion', sektion: 'sektion',
  nr: 'nr', nummer: 'nr',
};
// Kategorien für die Auswahl-Chips: die fünf Leitforderungen, danach die Themen der „Weiteren Forderungen“ (Feld „thema“ = ###-Überschrift in Forderungen.md)
const sKat = f => KATEGORIE_LOGO[f.sektion] ? f.sektion : (f.thema || 'Weitere');
const S_LEIT_KATS = Object.keys(KATEGORIE_LOGO);
const S_THEMEN_KATS = [...new Set(FORDERUNGEN.filter(f => !KATEGORIE_LOGO[f.sektion]).map(sKat))];
const S_KATS = [...S_LEIT_KATS, ...S_THEMEN_KATS];

/* Normalisierung für den Vergleich. Liefert den Vergleichstext t, zu jedem Zeichen von t die Stelle im Original (map, für die Markierung)
   sowie Wortanfänge (ws) und Wortenden (we) als Positionen in t. Regeln: klein, Akzente/Umlaute ohne Punkte (ä → a), ß → ss,
   danach ae/oe/ue → a/o/u (so ist „Ärzte“ = „Aerzte“ = „Arzte“); Gendersternchen und weiche Trennstriche verschwinden ohne Wortgrenze,
   Bindestriche verschwinden mit Wortgrenze („E-Auto“ → „eauto“, „auto“ ist dort trotzdem ein Wortanfang), Punkte zwischen Ziffern
   verschwinden („7.500“ = „7500“), alles andere wird zu einem einzelnen Leerzeichen. Suchbegriff und Text laufen durch dieselbe Funktion. */
function sNorm(src) {
  src = String(src);
  const t = [], map = [], ws = new Set(), we = new Set();
  let imWort = false, neuesWort = true;
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (ch === '*' || ch === '­') continue;
    if (/[-‐‑]/.test(ch) && imWort) { we.add(t.length); neuesWort = true; continue; }
    if (ch === '.' && /\d/.test(src[i - 1] || '') && /\d/.test(src[i + 1] || '')) continue;
    if (/[\p{L}\p{N}]/u.test(ch)) {
      const teile = ch === 'ß' || ch === 'ẞ' ? 'ss' : ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      for (const c of teile) {
        if (!imWort || neuesWort) { ws.add(t.length); neuesWort = false; }
        else if (c === 'e' && /[aou]/.test(t[t.length - 1])) continue;   // ae/oe/ue → a/o/u
        imWort = true;
        t.push(c); map.push(i);
      }
    } else {
      if (imWort) we.add(t.length);
      imWort = false; neuesWort = true;
      if (t.length && t[t.length - 1] !== ' ') { t.push(' '); map.push(i); }
    }
  }
  if (imWort) we.add(t.length);
  const text = t.join('');
  // Wörter als [Anfang, Ende) – für die Tippfehler-Suche
  const anf = [...ws].sort((a, b) => a - b), enden = [...we].sort((a, b) => a - b);
  const woerter = anf.map(a => [a, enden.find(e => e > a)]).filter(([, e]) => e != null);
  return { t: text, map, ws, we, woerter };
}
const sNormText = s => sNorm(s).t.trim();

// Suchindex: einmal beim Start
const S_DOCS = FORDERUNGEN.map(f => {
  const plain = { head: klartext(f.head), text: klartext(f.text), sektion: [f.sektion, f.thema].filter(Boolean).join(' · ') };   // „kategorie:“ findet Leitforderung und Thema
  return { f, plain, n: { head: sNorm(plain.head), text: sNorm(plain.text), sektion: sNorm(plain.sektion) }, kat: sKat(f) };
});
const S_IN_BEITRAEGEN = new Map();   // Forderungsnummer → Anzahl Beiträge, in denen sie vorkommt
FEED_ORDER.flat().forEach(nr => S_IN_BEITRAEGEN.set(nr, (S_IN_BEITRAEGEN.get(nr) || 0) + 1));
const S_SYN = new Map();
SUCH_SYNONYME.forEach(gruppe => {
  const g = gruppe.map(sNormText);
  g.forEach(w => S_SYN.set(w, g.filter(x => x !== w)));
});

// Suchanfrage zerlegen → Klauseln (UND-verknüpft); jede Klausel hat Alternativen (ODER) und ist ggf. verneint
function sParse(q) {
  const toks = [];
  let i = 0;
  while (i < q.length) {
    if (/\s/.test(q[i])) { i++; continue; }
    if (q[i] === '|') { toks.push({ op: true }); i++; continue; }
    let neg = false, feld = '';
    if (q[i] === '-' && q[i + 1] && !/\s/.test(q[i + 1])) { neg = true; i++; }
    const m = /^([a-zäöüß]+):(?=\S)/i.exec(q.slice(i));
    if (m && S_FELD_ALIAS[m[1].toLowerCase()]) { feld = S_FELD_ALIAS[m[1].toLowerCase()]; i += m[0].length; }
    let text = '', phrase = false;
    if (/["„“”»«]/.test(q[i])) {
      const rest = q.slice(i + 1), zu = rest.search(/["“”«»]/);
      text = zu < 0 ? rest : rest.slice(0, zu);
      i += 1 + text.length + (zu < 0 ? 0 : 1);
      phrase = true;
    } else {
      text = /^[^\s|"„“”»«]*/.exec(q.slice(i))[0];
      i += Math.max(1, text.length);
    }
    if (!phrase && !neg && !feld && /^(oder|or)$/i.test(text)) { toks.push({ op: true }); continue; }
    toks.push({ neg, feld, text, phrase });
  }
  const klauseln = [];
  let oder = false;
  for (const tk of toks) {
    if (tk.op) { oder = true; continue; }
    let atom = null;
    const nrText = tk.feld === 'nr' ? tk.text.replace(/^#/, '') : (/^#/.test(tk.text) ? tk.text.slice(1) : null);
    if (nrText != null && /^\d+(-\d+)?(,\d+(-\d+)?)*$/.test(nrText)) {
      const teile = nrText.split(',').map(x => x.split('-').map(Number));
      atom = { roh: tk.text, nr: n => teile.some(([a, b = a]) => n >= Math.min(a, b) && n <= Math.max(a, b)) };
    } else {
      const t = sNormText(tk.text);
      if (t) atom = { roh: tk.text, t, phrase: tk.phrase, feld: tk.feld === 'nr' ? '' : tk.feld };
    }
    oder = oder && !tk.neg;
    if (!atom) { oder = false; continue; }
    const letzte = klauseln[klauseln.length - 1];
    if (oder && letzte && !letzte.neg) letzte.alts.push(atom);
    else klauseln.push({ neg: tk.neg, alts: [atom] });
    oder = false;
  }
  // Synonyme als zusätzliche Alternativen
  klauseln.forEach(k => {
    k.alts.slice().forEach(a => {
      if (a.t && !a.phrase && S_SYN.has(a.t)) S_SYN.get(a.t).forEach(s => k.alts.push({ ...a, roh: s, t: s, syn: true }));
    });
  });
  return klauseln;
}

// Alle Fundstellen des normalisierten Begriffs t im normalisierten Feld nf; q = Güte (3 ganzes Wort, 2 Wortanfang, 1 Wortteil)
function sFinde(nf, t, modus) {
  const out = [];
  for (let pos = nf.t.indexOf(t); pos !== -1; pos = nf.t.indexOf(t, pos + 1)) {
    const anfang = nf.ws.has(pos), ganz = anfang && nf.we.has(pos + t.length);
    if (modus === 'anfang' && !anfang) continue;
    if (modus === 'wort' && !ganz) continue;
    out.push({ a: pos, b: pos + t.length, q: ganz ? 3 : anfang ? 2 : 1 });
  }
  return out;
}
// Kleinster Bearbeitungsabstand (mit Vertauschung zweier Nachbarzeichen) von p zu irgendeinem Teilstück von w, höchstens k?
function sAehnlich(p, w, k) {
  const m = p.length;
  if (w.length < m - k) return false;
  let vor2 = null, vor = Array.from({ length: m + 1 }, (_, i) => i);
  for (let j = 1; j <= w.length; j++) {
    const cur = [0];
    for (let i = 1; i <= m; i++) {
      let d = Math.min(vor[i] + 1, cur[i - 1] + 1, vor[i - 1] + (p[i - 1] === w[j - 1] ? 0 : 1));
      if (vor2 && i > 1 && p[i - 1] === w[j - 2] && p[i - 2] === w[j - 1]) d = Math.min(d, vor2[i - 2] + 1);
      cur.push(d);
    }
    if (cur[m] <= k) return true;
    vor2 = vor; vor = cur;
  }
  return false;
}
function sFindeAehnlich(nf, t, k) {
  const out = [];
  for (const [a, b] of nf.woerter) if (sAehnlich(t, nf.t.slice(a, b), k)) out.push({ a, b, q: 1, aehnlich: true });
  return out;
}

const sFelder = (atom, z) => atom.feld ? [atom.feld] : z.feld === 'alle' ? ['head', 'text'] : [z.feld];

// Trifft ein Suchbaustein die Forderung? → { score, fund: { feld: [Fundstellen] } } oder null
function sAtom(doc, atom, z) {
  if (atom.nr) return atom.nr(doc.f.nr) ? { score: 20, fund: {} } : null;
  let score = 0;
  const fund = {};
  for (const k of sFelder(atom, z)) {
    const nf = doc.n[k];
    const f = atom.k ? sFindeAehnlich(nf, atom.t, atom.k) : sFinde(nf, atom.t, z.modus);
    if (!f.length) continue;
    const beste = Math.max(...f.map(x => x.q));
    score += S_GEWICHT[k] * (beste + 0.25 * Math.min(f.length - 1, 3)) * (atom.k ? 0.4 : 1) * (atom.syn ? 0.7 : 1)
           + (k === 'head' && f[0].a === 0 ? 1 : 0);   // Forderung beginnt mit dem Begriff
    fund[k] = f;
  }
  return score ? { score, fund } : null;
}

// Zustand der Suche (Eingabe und Optionen im Fenster)
const sZ = { q: '', kats: new Set(), modus: 'teil', feld: 'alle', sort: 'relevanz', tipp: true, nur: true };

// Führt die Suche aus: { liste: [{ doc, score, fund }], proKat: Map, hinweise: [], aktiv }
function sSuchen(z = sZ) {
  const klauseln = sParse(z.q);
  const hinweise = [];
  // Tippfehler-Toleranz: nur für Begriffe, die (ab 5 Zeichen) wörtlich nirgends vorkommen.
  // Erst 1 abweichendes Zeichen; 2 nur bei langen Begriffen und nur, wenn 1 nichts findet (hält die Treffer eng).
  for (const k of klauseln) {
    if (k.neg) continue;
    for (const a of k.alts) {
      if (!a.t || a.phrase || a.syn || !z.tipp || a.t.length < 5 || a.t.includes(' ')) continue;
      if (S_DOCS.some(d => sAtom(d, a, z))) continue;
      a.k = 1;
      if (a.t.length >= 8 && !S_DOCS.some(d => sAtom(d, a, z))) a.k = 2;
    }
  }
  const positiv = klauseln.filter(k => !k.neg);
  const aktiv = klauseln.length > 0 || z.kats.size > 0;
  const liste = [], proKat = new Map(S_KATS.map(k => [k, 0]));
  if (aktiv) {
    for (const doc of S_DOCS) {
      let score = 0, ok = true;
      const fund = { head: [], text: [] };
      for (const k of klauseln) {
        let best = 0, hit = false;
        for (const a of k.alts) {
          const r = sAtom(doc, a, z);
          if (!r) continue;
          hit = true; best = Math.max(best, r.score);
          if (!k.neg) { (r.fund.head || []).forEach(x => fund.head.push(x)); (r.fund.text || []).forEach(x => fund.text.push(x)); }
        }
        if (k.neg ? hit : !hit) { ok = false; break; }
        score += best;
      }
      if (!ok) continue;
      proKat.set(doc.kat, proKat.get(doc.kat) + 1);
      if (z.kats.size && !z.kats.has(doc.kat)) continue;
      liste.push({ doc, score, fund });
    }
    if (z.sort === 'nr' || !positiv.length) liste.sort((a, b) => a.doc.f.nr - b.doc.f.nr);
    else liste.sort((a, b) => b.score - a.score || a.doc.f.nr - b.doc.f.nr);
  }
  // Hinweise: ähnliche Schreibweisen und mitgesuchte Synonyme
  for (const k of positiv) for (const a of k.alts) {
    if (a.k) {
      const woerter = new Map();
      liste.forEach(r => ['head', 'text'].forEach(f => (r.fund[f] || []).forEach(x => {
        if (!x.aehnlich) return;
        const nf = r.doc.n[f], w = r.doc.plain[f].slice(nf.map[x.a], nf.map[x.b - 1] + 1);
        woerter.set(w.toLowerCase(), (woerter.get(w.toLowerCase()) || 0) + 1);
      })));
      const top = [...woerter].sort((x, y) => y[1] - x[1]).slice(0, 6).map(x => x[0]);
      hinweise.push(top.length
        ? `Keine genauen Treffer für „${a.roh}“ – ähnliche Schreibweisen: ${top.join(', ')}`
        : `Keine Treffer für „${a.roh}“, auch keine ähnlichen Schreibweisen.`);
    }
  }
  const syn = positiv.flatMap(k => k.alts.filter(a => a.syn).map(a => a.roh));
  if (syn.length) hinweise.push('Auch gesucht: ' + [...new Set(syn)].join(', '));
  return { liste, proKat, hinweise, aktiv };
}

// Text mit <mark> an den Fundstellen (Positionen in der Normalform → Positionen im Original)
function sMarkiert(plain, nf, fund) {
  if (!fund || !fund.length) return esc(plain);
  const iv = fund.map(x => [nf.map[x.a], nf.map[x.b - 1] + 1]).sort((x, y) => x[0] - y[0]);
  const zus = [];
  iv.forEach(([a, b]) => { const l = zus[zus.length - 1]; if (l && a <= l[1]) l[1] = Math.max(l[1], b); else zus.push([a, b]); });
  let out = '', pos = 0;
  zus.forEach(([a, b]) => { out += esc(plain.slice(pos, a)) + '<mark>' + esc(plain.slice(a, b)) + '</mark>'; pos = b; });
  return out + esc(plain.slice(pos));
}

// Beiträge für den Feed: alle mit mindestens einem Treffer, der beste Treffer zuerst.
// nur = true: je Beitrag nur die Treffer-Bilder, jede Forderung nur einmal (im bestplatzierten Beitrag).
function sBeitraege(liste, nur) {
  const rang = new Map(liste.map((r, i) => [r.doc.f.nr, i]));
  const kandidaten = [];
  POSTS.forEach((p, pos) => {
    const hits = p.slides.filter(f => rang.has(f.nr));
    if (hits.length) kandidaten.push({ p, pos, hits, best: Math.min(...hits.map(f => rang.get(f.nr))) });
  });
  kandidaten.sort((a, b) => a.best - b.best || a.pos - b.pos);
  const gesehen = new Set(), aus = [];
  for (const k of kandidaten) {
    const trefferNr = new Set(k.hits.map(f => f.nr));
    if (nur) {
      const slides = k.hits.filter(f => !gesehen.has(f.nr)).sort((a, b) => rang.get(a.nr) - rang.get(b.nr));
      slides.forEach(f => gesehen.add(f.nr));
      if (slides.length) aus.push({ ...k.p, basis: k.p, slides, trefferNr, start: 0 });
    } else {
      aus.push({ ...k.p, basis: k.p, trefferNr, start: k.p.slides.findIndex(f => rang.get(f.nr) === k.best) });
    }
  }
  return aus;
}

// Nach dem Einfügen eines Beitrags: Treffer-Punkte markieren (ganze Beiträge) und zum passenden Bild springen
function trefferZeigen(el, p) {
  if (!p) return;
  if (p.trefferNr && p.basis && p.slides === p.basis.slides) {
    const dots = el.querySelectorAll('.dot');
    p.slides.forEach((f, i) => { if (p.trefferNr.has(f.nr) && dots[i]) dots[i].classList.add('treffer'); });
  }
  if (p.start > 0) {
    const slider = el.querySelector('.slider');
    slider.scrollTo({ left: p.start * slider.clientWidth, behavior: 'instant' });
  }
}

let SUCHE = null;   // aktive Suche im Feed: { z (Kopie des Zustands), anzahl, beitraege } oder null
const leisteEl = document.createElement('div');
leisteEl.className = 'such-leiste';
leisteEl.hidden = true;
leisteEl.innerHTML = `<img src="1211.svg" alt=""><span class="such-leiste-text" role="status"></span>
  <button type="button" data-k="aendern" aria-haspopup="dialog">Ändern</button>
  <button type="button" data-k="aufheben" aria-label="Suche aufheben">✕</button>`;
FEED.before(leisteEl);

const sBeschreibung = z => [z.q.trim() ? `„${z.q.trim()}“` : '', [...z.kats].join(', ')].filter(Boolean).join(' · ');

function sHashSchreiben(z) {
  const u = new URLSearchParams();
  if (z.q.trim()) u.set('suche', z.q.trim());
  if (z.kats.size) u.set('kat', [...z.kats].join('|'));   // Namen statt Nummern: Links bleiben gültig, wenn Themen dazukommen
  if (z.modus !== 'teil') u.set('modus', z.modus);
  if (z.feld !== 'alle') u.set('feld', z.feld);
  if (z.sort !== 'relevanz') u.set('sort', z.sort);
  if (!z.tipp) u.set('tipp', '0');
  if (!z.nur) u.set('nur', '0');
  history.replaceState(null, '', location.pathname + location.search + (u.toString() ? '#' + u : ''));
}
function sHashLesen() {
  const u = new URLSearchParams(location.hash.slice(1));
  if (!u.has('suche') && !u.has('kat')) return false;
  sZ.q = u.get('suche') || '';
  const kat = u.get('kat') || '';
  sZ.kats = new Set(/^[\d,]+$/.test(kat)
    ? kat.split(',').map(Number).filter(i => i < S_LEIT_KATS.length).map(i => S_LEIT_KATS[i])   // ältere Links mit Nummern (0–4 = Leitforderungen)
    : kat.split('|').filter(k => S_KATS.includes(k)));
  if (['teil', 'anfang', 'wort'].includes(u.get('modus'))) sZ.modus = u.get('modus');
  if (['alle', 'head', 'text'].includes(u.get('feld'))) sZ.feld = u.get('feld');
  if (['relevanz', 'nr'].includes(u.get('sort'))) sZ.sort = u.get('sort');
  sZ.tipp = u.get('tipp') !== '0';
  sZ.nur = u.get('nur') !== '0';
  return true;
}

// Filtert den Feed auf die Treffer. zielNr: diese Forderung (bzw. ihr Beitrag) steht ganz vorn.
function sucheAnwenden(ergebnis, zielNr = null) {
  const beitraege = sBeitraege(ergebnis.liste, sZ.nur);
  if (zielNr != null) {
    const i = beitraege.findIndex(p => p.slides.some(f => f.nr === zielNr));
    if (i < 0) { toast('Diese Forderung steht in keinem Beitrag'); return false; }
    const [p] = beitraege.splice(i, 1);
    beitraege.unshift({ ...p, start: p.slides.findIndex(f => f.nr === zielNr) });
  }
  SUCHE = { z: { ...sZ, kats: new Set(sZ.kats) }, anzahl: ergebnis.liste.length, beitraege: beitraege.length };
  lauf++;
  ANSICHT = beitraege;
  beitraegeZeigen(0, Math.min(ERSTE_ETAPPE, ANSICHT.length), true);
  if (!ANSICHT.length) FEED.innerHTML = '<p class="lade-hinweis">Keine Beiträge zu dieser Suche.</p>';
  const nr = lauf;
  idle(() => weitere(ERSTE_ETAPPE, nr));
  leisteEl.querySelector('.such-leiste-text').textContent =
    `${sBeschreibung(SUCHE.z)} · ${SUCHE.anzahl} ${SUCHE.anzahl === 1 ? 'Forderung' : 'Forderungen'} in ${SUCHE.beitraege} ${SUCHE.beitraege === 1 ? 'Beitrag' : 'Beiträgen'}`;
  leisteEl.hidden = false;
  sHashSchreiben(sZ);
  sLinksZeigen();
  window.scrollTo({ top: FEED.getBoundingClientRect().top + scrollY - leisteEl.offsetHeight, behavior: 'instant' });   // Leiste oben, erster Treffer direkt darunter
  return true;
}
// Suchansicht ist zu Ende (Logo angetippt oder aufgehoben): Leiste und Adresse zurücksetzen
function sucheBeendet() {
  SUCHE = null;
  leisteEl.hidden = true;
  history.replaceState(null, '', location.pathname + location.search);
  sLinksZeigen();
}
// Suche aufheben: wieder alle Beiträge in der Reihenfolge vom Seitenstart
function sucheAufheben() {
  if (!SUCHE) return;
  sucheBeendet();
  lauf++;
  ANSICHT = POSTS;
  beitraegeZeigen(0, Math.min(ERSTE_ETAPPE, ANSICHT.length), true);
  const nr = lauf;
  idle(() => weitere(ERSTE_ETAPPE, nr));
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function sLinksZeigen() {

function sTrefferHTML(r) {

  return `<button class="such-erg" type="button" data-nr="${esc(f.nr)}">

function sListeFuellen(bis) {
  const { liste } = sErgebnis;
  suchListe.querySelector('.such-weiter')?.remove();
  suchListe.insertAdjacentHTML('beforeend', liste.slice(sGezeigt, bis).map(sTrefferHTML).join(''));
  sGezeigt = Math.min(bis, liste.length);
  if (sGezeigt < liste.length)
    suchListe.insertAdjacentHTML('beforeend', `<button class="such-weiter" type="button">Weitere ${Math.min(S_SEITE, liste.length - sGezeigt)} von ${liste.length - sGezeigt} anzeigen</button>`);
}

function sAktualisieren() {
  sErgebnis = sSuchen();
  const { liste, proKat, hinweise, aktiv } = sErgebnis;
  suchEl.querySelectorAll('.such-chip').forEach(b => {
    const k = b.dataset.kat, n = proKat.get(k);
    b.setAttribute('aria-pressed', String(sZ.kats.has(k)));
    b.querySelector('small').textContent = aktiv ? n : '';
    b.classList.toggle('leer', aktiv && !n && !sZ.kats.has(k));
  });
  // Zusammenfassung am zugeklappten Themenbereich: Treffer in den Themen und gewählte Themen
  const themenTreffer = S_THEMEN_KATS.reduce((a, k) => a + proKat.get(k), 0);
  const themenGewaehlt = S_THEMEN_KATS.filter(k => sZ.kats.has(k)).length;
  suchThemen.querySelector('summary small').textContent =
    [aktiv ? `${themenTreffer} Treffer` : `${S_THEMEN_KATS.length}`, themenGewaehlt ? `${themenGewaehlt} gewählt` : ''].filter(Boolean).join(' · ');
  // War die Liste schon hochgescrollt, neue Treffer ab ihrem Anfang zeigen (Filter bleiben dabei weiter oben hinausgescrollt)
  const listeOben = suchListe.getBoundingClientRect().top - suchEl.querySelector('.such-oben').getBoundingClientRect().bottom;
  if (listeOben < 0) suchDialog.scrollTop += listeOben;
  suchListe.innerHTML = '';
  sGezeigt = 0;
  if (!aktiv) {
    suchStatus.textContent = '';
    suchListe.innerHTML = `<p class="such-leer">Suchbegriff eingeben oder eine Kategorie wählen. ${FORDERUNGEN.length} Forderungen werden durchsucht – „Optionen und Suchhilfe“ zeigt, wie sich Begriffe kombinieren und ausschließen lassen.</p>`;
  } else {
    const beitraege = sBeitraege(liste, sZ.nur).length;
    suchStatus.innerHTML = esc(`${liste.length} ${liste.length === 1 ? 'Forderung' : 'Forderungen'} · in ${beitraege} ${beitraege === 1 ? 'Beitrag' : 'Beiträgen'}`) +
      hinweise.map(h => `<span class="such-hinweis">${esc(h)}</span>`).join('');
    if (liste.length) sListeFuellen(S_SEITE);
    else suchListe.innerHTML = '<p class="such-leer">Keine passenden Forderungen. Weniger oder andere Begriffe probieren, Kategorien abwählen oder unter „Optionen“ die Treffer auf Wortteile erweitern.</p>';
  }
  const geht = aktiv && liste.length > 0;
  const nB = geht ? sBeitraege(liste, sZ.nur).length : 0;
  suchGo.textContent = geht ? `Im Feed zeigen (${nB} ${nB === 1 ? 'Beitrag' : 'Beiträge'})` : 'Im Feed zeigen';
  if (geht) suchGo.removeAttribute('aria-disabled'); else suchGo.setAttribute('aria-disabled', 'true');
  sLinksZeigen();
}

function sFormularSetzen() {
  suchInput.value = sZ.q;
  suchEl.querySelectorAll('[data-opt]').forEach(el => {
    if (el.type === 'checkbox') el.checked = sZ[el.dataset.opt]; else el.value = sZ[el.dataset.opt];
  });
}

function suchOpen(opener) {
  if (suchEl.classList.contains('open')) return;
  suchOpener = opener || null;
  if (SUCHE) Object.assign(sZ, { ...SUCHE.z, kats: new Set(SUCHE.z.kats) });   // aktive Suche im Feed weiterbearbeiten
  sFormularSetzen();
  if (sZ.q.trim()) suchThemen.open = false;
  sAktualisieren();
  suchEl.classList.add('open');
  document.documentElement.style.overflow = 'hidden';   // Seite dahinter nicht scrollbar
  appEl.inert = true;
  suchInput.focus();
  suchInput.select();
}
function suchClose(fokus = true) {
  suchEl.classList.remove('open');
  document.documentElement.style.overflow = '';
  appEl.inert = false;
  if (fokus && suchOpener && suchOpener.isConnected) suchOpener.focus({ preventScroll: true });
}
function sZeigen(zielNr = null) {
  if (!sErgebnis || !sErgebnis.aktiv || !sErgebnis.liste.length) return;
  if (zielNr != null && !S_IN_BEITRAEGEN.has(zielNr)) { toast('Diese Forderung steht in keinem Beitrag'); return; }
  suchClose(false);
  if (sucheAnwenden(sErgebnis, zielNr)) leisteEl.querySelector('[data-k="aendern"]').focus({ preventScroll: true });
}

suchInput.addEventListener('input', () => {
  sZ.q = suchInput.value;
  if (sZ.q.trim()) suchThemen.open = false;   // beim Suchen Platz für die Trefferliste schaffen
  clearTimeout(sTimer);
  sTimer = setTimeout(sAktualisieren, 120);
});
suchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(sTimer); sAktualisieren(); sZeigen(); }
  else if (e.key === 'ArrowDown') { const erst = suchListe.querySelector('.such-erg'); if (erst) { e.preventDefault(); erst.focus(); } }
});
suchListe.addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const alle = [...suchListe.querySelectorAll('.such-erg, .such-weiter')], i = alle.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  if (e.key === 'ArrowUp' && i === 0) suchInput.focus();
  else (alle[i + (e.key === 'ArrowDown' ? 1 : -1)] || alle[i]).focus();
});
suchEl.addEventListener('change', e => {
  const o = e.target.dataset.opt;
  if (!o) return;
  sZ[o] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  sAktualisieren();
});
suchEl.addEventListener('click', e => {
  if (e.target === suchEl || e.target.closest('.such-x')) return suchClose();   // Tipp auf den Hintergrund oder ✕
  const chip = e.target.closest('.such-chip');
  if (chip) { const k = chip.dataset.kat; sZ.kats.has(k) ? sZ.kats.delete(k) : sZ.kats.add(k); return sAktualisieren(); }
  const erg = e.target.closest('.such-erg');
  if (erg) return sZeigen(Number(erg.dataset.nr));
  const weiter = e.target.closest('.such-weiter');
  if (weiter) { const i = sGezeigt; sListeFuellen(sGezeigt + S_SEITE); suchListe.querySelectorAll('.such-erg')[i]?.focus(); return; }
  if (e.target.closest('.such-go')) return sZeigen();
  const k = e.target.closest('[data-k]');
  if (k && k.dataset.k === 'aufheben') { suchClose(false); sucheAufheben(); return; }
  if (k && k.dataset.k === 'kopieren' && sErgebnis) {
    const l = sErgebnis.liste, titel = `Suche ${sBeschreibung(sZ)} – ${l.length} ${l.length === 1 ? 'Forderung' : 'Forderungen'}`;
    exportiereText({
      rein: titel + '\n\n' + l.map(r => `Nr. ${r.doc.f.nr} · ${r.doc.kat}\n${r.doc.plain.head}\n${r.doc.plain.text}`).join('\n\n'),
      html: `<p><b>${esc(titel)}</b></p>` + l.map(r => `<p>Nr. ${esc(r.doc.f.nr)} · ${esc(r.doc.kat)}<br><b>${esc(r.doc.plain.head)}</b><br>${fetttext(r.doc.f.text)}</p>`).join(''),
    });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && suchEl.classList.contains('open')) return suchClose();
  if (document.querySelector('.ki-overlay.open')) return;   // anderes Fenster offen
  const tippt = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
  if ((e.key === '/' && !tippt && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
    e.preventDefault();
    suchOpen(document.activeElement);
  }
});
FEED.addEventListener('click', e => {
  const b = e.target.closest('[data-action="suche"]');
  if (b) suchOpen(b);
});
leisteEl.addEventListener('click', e => {
  const k = e.target.closest('[data-k]');
  if (!k) return;
  if (k.dataset.k === 'aendern') suchOpen(k);
  else sucheAufheben();
});

// Suche aus der Adresse (#suche=…) gleich beim Laden anwenden
if (sHashLesen()) {
  const erg = sSuchen();
  if (erg.aktiv && erg.liste.length) { sErgebnis = erg; sucheAnwenden(erg); }
}

// Schnittstelle für export_thesen.py: das Skript setzt Bilder mit genau diesen Funktionen und Daten zusammen.
// Bei Umbenennungen hier mitziehen, sonst meldet das Export-Skript, dass es angepasst werden muss.
window.LINKSINSTA_EXPORT = Object.freeze({ FORDERUNGEN, BY_NR, POSTS, FEED_ORDER, slideHTML, fitText, verlaufVon, exportAuftrag });   // POSTS ist zufällig sortiert, FEED_ORDER in fester Reihenfolge

}); // Ende DOMContentLoaded
</script>
</body>
