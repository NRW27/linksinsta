<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>linksinsta</title>
<style>
  /* Alle Maße in cqw (1cqw = 1 % der App-Breite), abgeleitet vom Screenshot (1280 px breit = 100cqw) */
  /* Schriften (lokal, Ordner fonts/): Inter für Fließtext und Oberfläche, Work Sans Black für die plakative Forderung */
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/Inter-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-style: italic; font-display: swap; src: url("fonts/Inter-Italic.ttf") format("truetype"); }
  @font-face { font-family: "Inter"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/Inter-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/Inter-Bold.ttf") format("truetype"); }
  @font-face { font-family: "Work Sans"; font-weight: 300; font-style: normal; font-display: swap; src: url("fonts/WorkSans-Light.ttf") format("truetype"); }
  @font-face { font-family: "Work Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/WorkSans-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Work Sans"; font-weight: 900; font-style: normal; font-display: swap; src: url("fonts/WorkSans-Black.ttf") format("truetype"); }

  :root {
    --font-text: "Inter", sans-serif;
    --font-head: "Work Sans", sans-serif;
    --body-size: 4.94cqw;    /* feste Schriftgröße der ergänzenden Erklärung (1cqw = 1 % der App-Breite) */
    --body-font: var(--font-head);   /* Schrift der Erklärung; Rückbau auf die alte Optik: var(--font-text) mit --body-weight 500 und --em-weight 700 */
    --body-weight: 300;      /* Grundschrift der Erklärung: dünn (Work Sans Light) */
    --em-weight: 900;        /* hervorgehobene Wörter (**Wort** in forderungen.js): fett (Work Sans Black) */
    --text: #262626;
    --accent: #5a67e6;      /* aktiver Punkt */
    --dot: #d2d2d8;        /* inaktive Punkte */
    --placeholder: #e6e6ea; /* Platzhalterfarbe, solange ein Beitragsbild lädt (wie die Platzhalter .sk, dazu derselbe Glanz) */
    --dim: 0.2;             /* Deckkraft der generellen Abdunklung unter dem Farbverlauf (0.2 = 20 %), hält die Schrift in der Bildmitte lesbar */
    --dim-farbe: 0 0 0;     /* Farbe der Abdunklung als RGB-Kanäle: Schwarz (Alternative: 129 0 161 = Violett #8100A1) */
    --verlauf-start: 30%;   /* Höhe im Bild (von oben), ab der der Rot-Verlauf beginnt */
    --verlauf-ende: 100%;   /* Höhe im Bild (von oben), an der der Verlauf seine Endstufe erreicht hat (#FF0000 mit 80 % Deckkraft = #ff0000cc) */
    --blende-dauer: 220ms;  /* Überblendung beim Bildwechsel (kurz und sanft; 0ms = harter Wechsel) */
    --kat-groesse: 17cqw;   /* Kantenlänge der quadratischen Logos: Kategorie oben links, 1210.svg oben rechts */
    --kat-schrift: 3cqw;    /* Schriftgröße des Ersatztitels, solange das Logo fehlt („Gesundheit“ füllt so gerade die Logobreite) */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #fff; }   /* Flächen links und rechts der Beiträge weiß (wie der Header, in beiden Formaten) */
  body {
    color: var(--text);
    font-family: var(--font-text);
    -webkit-text-size-adjust: 100%;
  }
  .app {
    width: min(100%, 480px);
    min-height: 100dvh;
    margin: 0 auto;
    background: #fff;
    container-type: inline-size;
    padding-top: env(safe-area-inset-top, 0px);
  }
  img { display: block; -webkit-user-drag: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- Querformat: zwei Beiträge nebeneinander ----------
     Hochformat: --u = 1cqw (1 % der App-Breite = Spaltenbreite).
     Querformat: Die App wird doppelt so breit (zwei Spalten à max. 480 px + Spalt), jeder Beitrag ist ein eigener Container,
     seine cqw beziehen sich also auf die Spaltenbreite – Beiträge sehen exakt aus wie im Hochformat.
     Der Header nimmt in beiden Formaten die volle Sichtbreite ein (z. B. iPad im Hochformat: Beiträge 480 px, Header über
     die ganze Breite); seine Maße (--u) bleiben auf die Spaltenbreite bezogen, so passen entsprechend mehr Kandidaten hinein.
     Auf dem Handy im Hochformat ist die Sichtbreite gleich der App-Breite – dort ändert sich nichts. */
  :root { --u: 1cqw; --spalt: 0px; }
  html { overflow-x: clip; }   /* verhindert seitliches Scrollen durch den 100vw breiten Header (Scrollleiste am Desktop) */
  .stories-wrap {
    /* Header bricht aus der App aus und nimmt die volle Sichtbreite ein */
    width: calc(100vw - var(--sb, 0px)); margin-inline: calc(50% - (100vw - var(--sb, 0px)) / 2);   /* --sb = Breite der Scrollleiste (Skript direkt nach <main>) */
    background: #fff;
  }
  .stories { padding-left: calc(2.35 * var(--u) + env(safe-area-inset-left, 0px)); padding-right: calc(2.35 * var(--u) + env(safe-area-inset-right, 0px)); }
  @media (orientation: landscape) and (min-width: 640px) {
    :root { --spalt: 112px; }   /* Test: verdoppelt (vorher 56px) */   /* Abstand zwischen den beiden Spalten */
    .app {
      width: min(100%, calc(2 * 480px + var(--spalt)));
      padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);   /* Notch bei gedrehtem Handy */
    }
    .stories-wrap { --u: calc((100cqw - var(--spalt)) / 200); }   /* 1 % einer Spaltenbreite (Header-Breite siehe oben) */
    #feed { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--spalt); align-items: start; }
    .post { container-type: inline-size; min-width: 0; }
    .lade-hinweis { grid-column: 1 / -1; font-size: 15px; line-height: 21px; }
  }

  /* ---------- Pfeil-Buttons für Maus-Bedienung (Header und Bilder eines Beitrags) ----------
     Nur auf Geräten mit Maus (hover + feiner Zeiger) sichtbar; auf Touch-Geräten bleiben sie ausgeblendet. */
  .stories-wrap { position: relative; }
  .pfeil {
    display: none; position: absolute; top: 50%; z-index: 4;
    width: 32px; height: 32px; margin-top: -16px; border-radius: 50%;
    align-items: center; justify-content: center;
    background: rgb(255 255 255 / 0.9); color: #262626;
    box-shadow: 0 1px 5px rgb(0 0 0 / 0.3);
    transition: opacity 150ms ease, transform 100ms ease;
  }
  .pfeil svg { width: 16px; height: 16px; }
  .pfeil:hover { background: #fff; }
  .pfeil:active { transform: scale(0.92); }
  .pfeil:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pfeil-l { left: 10px; }
  .pfeil-r { right: 10px; }
  .slider-wrap .pfeil { top: auto; bottom: 12px; margin-top: 0; }   /* im Beitrag ganz unten am Bild */
  .stories-wrap .pfeil { margin-top: -22px; }   /* auf Höhe der Kreise, nicht der Namen */
  .slider:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  @media (hover: hover) and (pointer: fine) {
    .pfeil { display: flex; }
    .pfeil[hidden] { display: none; }
    .slider-wrap .pfeil { opacity: 0; }   /* im Beitrag erst beim Überfahren mit der Maus */
    .slider-wrap:hover .pfeil, .slider-wrap:focus-within .pfeil { opacity: 1; }
    /* Header: Portraits unter den Pfeilen weichzeichnen – zum Rand hin stark, nach innen auslaufend */
    .stories-wrap::before, .stories-wrap::after {
      content: ""; position: absolute; top: 0; bottom: 0; z-index: 3; width: 76px;
      pointer-events: none;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      background: rgb(255 255 255 / 0.25);
    }
    .stories-wrap::before { left: 0;  -webkit-mask-image: linear-gradient(to right, #000 45%, transparent); mask-image: linear-gradient(to right, #000 45%, transparent); }
    .stories-wrap::after  { right: 0; -webkit-mask-image: linear-gradient(to left,  #000 45%, transparent); mask-image: linear-gradient(to left,  #000 45%, transparent); }
  }

  /* ---------- Header: Karussell mit runden Icons ---------- */
  .stories {
    position: relative;
    display: flex;
    gap: calc(3.05 * var(--u));
    padding: calc(2.2 * var(--u)) calc(2.35 * var(--u)) calc(1.6 * var(--u));
    overflow: hidden;      /* kein Scrollen des Browsers: das Skript verschiebt die Storys selbst (siehe „Story-Karussell“) */
    touch-action: pan-y;   /* senkrechtes Wischen scrollt die Seite, waagerechtes übernimmt das Skript */
  }
  .story { display: block; flex: 0 0 calc(24.2 * var(--u)); width: calc(24.2 * var(--u)); text-align: center; color: inherit; text-decoration: none; -webkit-touch-callout: none;
    will-change: transform; }   /* je Story eine kleine Grafikebene: wird beim Wischen nur verschoben, nie neu gezeichnet */
  .story-ring {
    width: calc(24.2 * var(--u)); aspect-ratio: 1; border-radius: 50%;
    padding: calc(0.7 * var(--u));
    background: linear-gradient(40deg, #f9c931 5%, #f2832b 25%, #e8326a 52%, #c52bc0 78%);
  }
  .story-gap { width: 100%; height: 100%; border-radius: 50%; background: #fff; padding: calc(1.1 * var(--u)); }
  .story-gap img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    background: #e6e6ea; box-shadow: 0 0 0 calc(0.15 * var(--u)) #dcdcdc;
  }
  .story-name {
    margin-top: calc(0.6 * var(--u));
    font-size: calc(2.65 * var(--u)); line-height: calc(3.4 * var(--u));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Beitrag ---------- */
  .post { padding-bottom: 5cqw; }
  .post-head {
    height: 13.5cqw; padding: 0 3.75cqw;
    display: flex; align-items: center; gap: 3.1cqw;
  }
  .post-avatar-link { display: block; flex: none; border-radius: 50%; line-height: 0; }
  .post-avatar {
    width: 7.65cqw; height: 7.65cqw; border-radius: 50%; object-fit: cover;
    background: #e9e4c4; box-shadow: 0 0 0 0.15cqw #ddd8b8;
  }
  .post-user { font-size: 3.1cqw; font-weight: 500; letter-spacing: 0.01em; }

  .slider {
    display: flex;
    aspect-ratio: 4 / 5;
    overflow-x: hidden;   /* kein natives seitliches Scrollen: nur das Skript wechselt das Bild (immer um genau ein ganzes Bild), so gibt es keine halb verschobenen Zwischenstände */
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;   /* hält das Bild bei Größenänderungen exakt ausgerichtet */
    touch-action: pan-y pinch-zoom;   /* seitliche Wischbewegungen übernimmt das Skript (sofortiger Bildwechsel, siehe unten); vertikales Scrollen bleibt unverändert */
    scrollbar-width: none;
    background: var(--placeholder);
  }
  .slider::-webkit-scrollbar { display: none; }
  .slider-wrap { position: relative; }
  /* Überblendung beim Bildwechsel: das neue Bild steht sofort an seiner Stelle, eine Kopie des bisherigen Bildes liegt kurz darüber und blendet aus */
  .blende { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; animation: blende-aus var(--blende-dauer) ease-out forwards; }
  .blende .slide { flex: none; width: 100%; height: 100%; }
  @keyframes blende-aus { from { opacity: 1; } to { opacity: 0; } }
  .slide {
    flex: 0 0 100%; height: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow: hidden; background: var(--placeholder); position: relative;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; }

  /* Abdunklung + Verlauf + Text auf dem Bild (liegen über dem Bild)
     Verlauf: am Anfang der Richtung ist das Bild unverändert, zum Ende hin geht es stufenlos in #FF0000 mit 80 % Deckkraft (#ff0000cc) über (#ff000000 = dasselbe Rot, voll durchsichtig).
     Die Richtung steht pro Bild im Attribut data-verlauf; gesetzt wird es aus der Tabelle VERLAUF (Skript, Abschnitt „Konfiguration“), ohne Eintrag gilt oben-unten. Alle Bilder eines Beitrags übernehmen dabei den Verlauf seines ersten Bildes. Die acht Modi:
       links-rechts  rechts-links  unten-oben  oben-unten
       ecke-lo-ru (links oben → rechts unten)  ecke-ro-lu (rechts oben → links unten)
       ecke-lu-ro (links unten → rechts oben)  ecke-ru-lo (rechts unten → links oben) */
  .slide { --verlauf-richtung: to bottom; --schatten-x: 0; --schatten-y: 1; --schatten-dir: 1; }   /* --schatten-dir: 1 = Schatten fällt zum Rot hin, -1 = vom Rot weg; gilt für Forderung und fette Wörter */
  .slide[data-verlauf="links-rechts"] { --verlauf-richtung: to right; --schatten-x: 1; --schatten-y: 0; }
  .slide[data-verlauf="rechts-links"] { --verlauf-richtung: to left; --schatten-x: -1; --schatten-y: 0; }
  .slide[data-verlauf="unten-oben"]   { --verlauf-richtung: to top; --schatten-x: 0; --schatten-y: -1; }
  .slide[data-verlauf="oben-unten"]   { --verlauf-richtung: to bottom; --schatten-x: 0; --schatten-y: 1; }
  .slide[data-verlauf="ecke-lo-ru"]   { --verlauf-richtung: 135deg; --schatten-x: 0.707; --schatten-y: 0.707; }   /* fester 45°-Winkel: „to bottom right“ wäre im 4:5-Format zu steil und sähe fast wie links-rechts aus */
  .slide[data-verlauf="ecke-ro-lu"]   { --verlauf-richtung: 225deg; --schatten-x: -0.707; --schatten-y: 0.707; }
  .slide[data-verlauf="ecke-lu-ro"]   { --verlauf-richtung: 45deg; --schatten-x: 0.707; --schatten-y: -0.707; }    /* links unten → rechts oben */
  .slide[data-verlauf="ecke-ru-lo"]   { --verlauf-richtung: 315deg; --schatten-x: -0.707; --schatten-y: -0.707; }   /* rechts unten → links oben */
  /* Farbverlauf für alle Bilder, diagonal von links oben nach rechts unten (135°, fester Winkel wie bei ecke-lo-ru):
     Farbe: 0–50 % Rot (#FF0000), 50–100 % gleichmäßiger Übergang nach Violett (#8100A1) in der rechten unteren Ecke.
     Transparenz (abgestimmt mit Testbildern): links oben 0 % (volles Rot) → stetig bis zur Bildmitte 70 % → stetig bis rechts unten 30 %.
     Das Foto ist so in der Bildmitte deutlich zu sehen, die Ecken bleiben kräftig farbig. (Mittelpunkt bei 60 % getestet, 50 % wirkt harmonischer.)
     Darunter liegt eine generelle Abdunklung (--dim, --dim-farbe: 20 % Schwarz), damit die Schrift auch auf hellen Fotostellen lesbar bleibt.
     Die Modus-Regeln oben (data-verlauf) wirken hier nicht mehr; zum Zurückschalten die Zeile mit linear-gradient(var(--verlauf-richtung) …) wieder eintragen. */
  .slide::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(135deg, rgb(255 0 0 / 1) 0%, rgb(255 0 0 / 0.3) 50%, rgb(129 0 161 / 0.7) 100%),
      rgb(var(--dim-farbe) / var(--dim));
  }
  .overlay { position: absolute; inset: 0; z-index: 2; color: #fff; text-align: center; pointer-events: none; }
  /* Feed: Ladeschicht. Darunter entsteht der fertige Beitrag (Bild, Verlauf, Text) unsichtbar; darüber liegt eine deckende
     Fläche in Platzhalterfarbe mit dem wandernden Glanz der Platzhalter (.sk). Erst wenn das Bild geladen und dekodiert ist
     (Klasse .wartet entfällt), verschwindet die Ladeschicht – der Beitrag erscheint auf einmal, nie halb fertig.
     isolation: Die Schichten der Folie bleiben unter Pfeilen und Überblendung. */
  .slide { isolation: isolate; }
  .lade { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; background: var(--placeholder); }
  .lade::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
    transform: translateX(-100%); animation: sk-glanz 1.4s ease-in-out infinite;
  }
  .slide:not(.wartet) > .lade { display: none; }
  /* Zwei Textzonen: Forderung am unteren Rand des oberen Drittels, Erklärung am oberen Rand der unteren Hälfte des Bildes (so nah wie möglich beieinander) */
  .zone {
    position: absolute; left: 5cqw; right: 5cqw;   /* 5cqw = PAD im Skript */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .zone-head { top: 0; height: calc(33.333% + 10%); justify-content: flex-end; }   /* Forderung: 10 % der Bildhöhe tiefer */
  .zone-body { bottom: 0; min-height: calc(50% - 5%); padding-bottom: 3cqw; justify-content: flex-start; }   /* Erklärung: 5 % der Bildhöhe tiefer; wächst bei sehr langen Texten nach oben, statt unten abgeschnitten zu werden */
  /* Schatten der plakativen Forderung: Richtung je Bild aus data-verlauf (--schatten-x/-y/-dir, siehe .slide oben), Größe in em, skaliert also mit der eingepassten Schriftgröße.
     Drei Lagen: harte dunkelrote Kante (plakativer Versatz), weicher Schlagschatten, schwaches Umfeld für Lesbarkeit auf hellen Bildstellen. */
  .head {
    width: max-content; margin: 0; font-family: var(--font-head); font-weight: 900; line-height: 1.08; letter-spacing: -0.01em; white-space: nowrap;
    text-shadow:
      calc(var(--schatten-x) * var(--schatten-dir) * 0.045em) calc(var(--schatten-y) * var(--schatten-dir) * 0.045em) 0 rgb(75 0 0 / 0.6),
      calc(var(--schatten-x) * var(--schatten-dir) * 0.10em)  calc(var(--schatten-y) * var(--schatten-dir) * 0.10em)  0.14em rgb(0 0 0 / 0.45),
      0 0 0.32em rgb(0 0 0 / 0.3);
  }
  .body { width: 100%; margin: 0; font-family: var(--body-font); font-size: var(--body-size); font-weight: var(--body-weight); line-height: 1.3;   /* bricht automatisch um */
    text-shadow: 0 0.05em 0.35em rgb(0 0 0 / 0.35); }   /* dezenter Schatten für die dünne Grundschrift */
  /* Fett gesetzte Wörter (Markierung **Wort** im Text): gleicher Schatten wie die Forderung, Richtung folgt dem Verlauf des Bildes */
  .body strong {
    font-weight: var(--em-weight);
    text-shadow:
      calc(var(--schatten-x) * var(--schatten-dir) * 0.05em) calc(var(--schatten-y) * var(--schatten-dir) * 0.05em) 0 rgb(75 0 0 / 0.6),
      calc(var(--schatten-x) * var(--schatten-dir) * 0.11em) calc(var(--schatten-y) * var(--schatten-dir) * 0.11em) 0.15em rgb(0 0 0 / 0.5),
      0 0 0.3em rgb(0 0 0 / 0.3);
  }
  /* Kategorie-Logo der fünf Leitforderungen (1205.svg bis 1209.svg, Zuordnung siehe KATEGORIE_LOGO im Skript): quadratisch, oben links im Bild.
     Solange die SVG-Datei fehlt, steht an ihrer Stelle der Kategorie-Titel zweizeilig in Weiß, gesetzt wie die fett hervorgehobenen Wörter der Erklärung. */
  .kat {
    position: absolute; top: 4cqw; width: var(--kat-groesse); height: var(--kat-groesse);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; cursor: pointer;   /* klickbar, obwohl die Textebene (.overlay) Klicks sonst durchlässt */
  }
  .kat:active { transform: scale(0.94); }
  .kat:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }
  .kat-links { left: 4cqw; }     /* Kategorie-Logo 1205–1209.svg */
  .kat-rechts { right: 4cqw; }   /* Ecklogo 1210.svg auf allen Beiträgen (Ersatz: „NRW bezahlbar“) */
  .kat img { width: 100%; height: 100%; object-fit: contain; }
  .kat-hinweis { display: block; margin-top: 0.5em; font-size: 0.55em; font-weight: var(--body-weight); letter-spacing: 0.02em; }   /* kleiner Zusatz „Platzhalter“ unter dem Ersatztitel */
  .kat-text {
    font-family: var(--font-head); font-weight: var(--em-weight); font-size: var(--kat-schrift); line-height: 1.05; letter-spacing: -0.01em;
    text-shadow:
      calc(var(--schatten-x) * var(--schatten-dir) * 0.05em) calc(var(--schatten-y) * var(--schatten-dir) * 0.05em) 0 rgb(75 0 0 / 0.6),
      calc(var(--schatten-x) * var(--schatten-dir) * 0.11em) calc(var(--schatten-y) * var(--schatten-dir) * 0.11em) 0.15em rgb(0 0 0 / 0.5),
      0 0 0.3em rgb(0 0 0 / 0.3);
  }
  .ln { display: block; white-space: nowrap; }
  .ln:empty { display: none; }   /* Forderung mit nur zwei Wörtern: dritte Zeile bleibt leer */
  /* Jede Forderung liegt zwei- und dreizeilig im HTML; fitText() entscheidet je Bild per Klasse head-3, welche Fassung sichtbar ist */
  .head .v2, .head .v3 { width: max-content; margin-inline: auto; }   /* eigene Breite je Fassung, damit fitText() beide getrennt messen kann */
  .head .v3, .head.head-3 .v2 { display: none; }
  .head.head-3 .v3 { display: block; }

  .dots {
    display: flex; justify-content: center; gap: 0.95cqw;
    padding-top: 3cqw;
  }
  .dot {
    width: 1.2cqw; height: 1.2cqw; border-radius: 50%;
    background: var(--dot);
  }
  .dot.active { background: var(--accent); transform: scale(1.1); }

  .actions {
    margin-top: 2.1cqw;
    padding: 0 3.75cqw 0 3.1cqw;
    display: flex; align-items: center; gap: 3.6cqw;
  }
  .act { position: relative; display: flex; align-items: center; gap: 1.25cqw; }
  .act img { width: 5.9cqw; height: 5.9cqw; object-fit: contain; }
  .act-count { font-size: 3.3cqw; font-weight: 500; font-variant-numeric: tabular-nums; }
  .act:active { transform: scale(0.92); }
  .act.save { margin-left: auto; }

  /* „Gefällt mir“: Herz springt kurz auf, dazu Ring und sechs Funken in derselben Farbe wie 1200-aktiv.svg */
  .act.like img { transform-origin: 50% 55%; }
  .act.like.pop img { animation: heart-pop 520ms cubic-bezier(0.2, 0.8, 0.3, 1) both; }
  .act.like.unpop img { animation: heart-off 220ms ease-out both; }
  @keyframes heart-pop {

  .ki-overlay {

  { let alt = '0px'; const sb = () => { const w = (innerWidth - document.documentElement.clientWidth) + 'px'; if (w !== alt) { alt = w; document.documentElement.style.setProperty('--sb', w); } }; sb(); addEventListener('resize', sb); if (window.ResizeObserver) new ResizeObserver(sb).observe(document.documentElement); }   // ResizeObserver: Scrollleiste erscheint erst, wenn die Beiträge geladen sind

/* ---------- Dateinamen der fertig gesetzten Bilder (Export „Ganzer Beitrag“) ----------
   export_thesen.py erzeugt die Bilder mit genau diesen Namen (es ruft exportAuftrag() über window.LINKSINSTA_EXPORT auf),
   die Seite verwendet sie im Export-Dialog. Seite und Dateien bleiben so automatisch im Gleichklang.
     forderung-0123     Forderung mit dem Logo ihrer Kategorie (bzw. der Kategorie ihrer Gruppe, wenn sie nur in Gruppen einer Kategorie steht)
     forderung-0123a/b nur bei Forderungen, die in Fünfergruppen verschiedener Kategorien stehen: je Kategorie eine Fassung
                       mit deren Logo und Verlauf; Buchstaben in der Reihenfolge des ersten Vorkommens in feed-order.js */
const BUCHSTABEN = 'abcdefghijklmnopqrstuvwxyz';
const KAT_GRUPPEN = new Map();   // Forderungsnummer → Map(Kategorie → erste Gruppe dieser Kategorie)
FEED_ORDER.forEach((nrs, gruppe) => {
  const kat = (BY_NR.get(nrs[0]) || {}).sektion;
  nrs.forEach(nr => {
    if (!KAT_GRUPPEN.has(nr)) KAT_GRUPPEN.set(nr, new Map());
    if (!KAT_GRUPPEN.get(nr).has(kat)) KAT_GRUPPEN.get(nr).set(kat, gruppe);
  });
});
// Dateiname (ohne Endung) des Bildes, das die Forderung nr im Beitrag der Gruppe gruppe zeigt
function exportName(nr, gruppe) {
  const basis = 'forderung-' + String(nr).padStart(4, '0');
  const kats = KAT_GRUPPEN.get(nr);
  if (!kats || kats.size < 2 || gruppe == null) return basis;
  const i = [...kats.keys()].indexOf((BY_NR.get(FEED_ORDER[gruppe][0]) || {}).sektion);
  return i < 0 ? basis : basis + BUCHSTABEN[i];
}
// Alle Bilder einer Forderung für export_thesen.py: [{ name, gruppe }] (gruppe null = Logo der eigenen Kategorie)
function exportAuftrag(nr) {
  const basis = exportName(nr, null), kats = KAT_GRUPPEN.get(nr);
  if (!kats) return [{ name: basis, gruppe: null }];
  const gruppen = [...kats.values()];
  if (gruppen.length === 1) return [{ name: basis, gruppe: gruppen[0] }];
  return [{ name: basis, gruppe: null }, ...gruppen.map(g => ({ name: exportName(nr, g), gruppe: g }))];
}

/* Schlüssel des Herzen-Speichers im Browser (Details im Abschnitt „Gefällt mir“ weiter unten) */
const HK = { token: 'herzen.token', mine: 'herzen.mine', counts: 'herzen.counts' };

// Startwerte: herz-gruppen.js enthält einen Wert je 5er-Gruppe (Schlüssel 'p' + Nummer der Auftakt-Forderung = Beitrags-ID).
// Der Wert wird unverändert übernommen (11 bis 199). Angezeigt wird: Startwert + vom Server gezählte Herzen.
// Fehlt die Datei oder ein Eintrag, startet der Beitrag bei 0. Der Zähler selbst gehört dem ganzen Beitrag (ID = 'p' + erste Forderungs-Nummer).
const START = Object.fromEntries(POSTS.map(p => [p.id,
  typeof HERZ_GRUPPEN === 'undefined' ? 0 : (HERZ_GRUPPEN[p.id] ?? 0)]));

const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* =====================  Reihenfolge der Beiträge  =====================
   Bei jedem Seitenaufruf bekommt jeder Beitrag eine eigene Zufallszahl c (gleichverteilt zwischen 0,5 und 2).
   Wert = c * (Herzen + 10 * geteilt); die Beiträge werden von groß nach klein sortiert.
   Herzen = Startwert aus herz-gruppen.js + zuletzt bekannte, vom Server gezählte Herzen (also die Zahl, die unter dem Beitrag steht).
   Geteilt (p.shared) steht aktuell bei allen Beiträgen auf 0, die Zählung ist noch nicht angebunden.
   Bei gleichem Wert bleibt die Reihenfolge aus feed-order.js erhalten. */
const RANK = { cMin: 0.5, cMax: 2, sharedWeight: 10 };
{
  const cached = store.get(HK.counts, {}) || {};
  const randomC = () => RANK.cMin + Math.random() * (RANK.cMax - RANK.cMin);
  const scored = POSTS.map(p => {
    p.hearts = (START[p.id] ?? 0) + (Number(cached[p.id]) || 0);
    return { p, value: randomC() * (p.hearts + RANK.sharedWeight * p.shared) };   // genau ein c je Beitrag
  });
  scored.sort((a, b) => b.value - a.value);   // absteigend; Array.sort ist stabil
  POSTS.splice(0, POSTS.length, ...scored.map(x => x.p));
}

/* ---------- Story-Karussell als Endlos-Loop ----------
   Ohne das eingebaute Scrollen des Browsers: Safari auf dem iPad zeichnet einen scrollbaren Bereich nach Sprüngen
   der Scrollposition erst nach ~0,5 s neu (Leiste kurz weiß). Stattdessen liegt jede Story auf einer eigenen kleinen
   Grafikebene (will-change: transform), die nur noch verschoben, nie neu gezeichnet wird. Läuft eine Story links
   hinaus, wird sie rechts wieder angehängt (und umgekehrt) – dort ist sie nicht zu sehen, es gibt also keinen Sprung.
   Bedienung: Wischen mit Schwung (Finger/Stift), waagerechtes Mausrad/Trackpad, Pfeil-Buttons, Tab-Taste.
   Senkrechtes Wischen bleibt beim Browser (touch-action: pan-y) und scrollt wie gewohnt die Seite. */
// Pfeil-Symbole der Maus-Buttons (Header und Beiträge; sichtbar nur bei Maus, siehe CSS .pfeil)
const pfeilSVG = d => `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const PFEIL_L = pfeilSVG('M10 3 5 8l5 5'), PFEIL_R = pfeilSVG('m6 3 5 5-5 5');

const storiesEl = document.getElementById('stories');
let storyBewegtBis = 0;   // Zeitpunkt (performance.now), bis zu dem der Feed-Aufbau pausiert – das Karussell wird gerade bewegt
const storyHTML = s => `
  <a class="story" href="https://www.instagram.com/${encodeURIComponent(s.handle)}/" target="_blank" rel="noopener noreferrer" draggable="false" aria-label="${esc(s.name)} auf Instagram öffnen">
    <div class="story-ring"><div class="story-gap"><img src="${esc(s.img)}" alt="" draggable="false"></div></div>
    <div class="story-name">${esc(s.name)}</div>
  </a>`;

(() => {
  const el = storiesEl;
  const ruhig = matchMedia('(prefers-reduced-motion: reduce)');
  let items = [], kopien = 0;
  let schritt = 0, P = 0, x0 = 0;   // Abstand zweier Storys, Länge einer Runde, Lage der ersten Story ohne Verschiebung
  let o = 0;                        // Verschiebung (px): wächst beim Wischen nach links

  // Zeichnen: jede Story an ihren Platz in der Runde falten; der Bereich beginnt eine Story vor dem linken Rand
  const zeichnen = () => {
    if (!P) return;
    storyBewegtBis = performance.now() + 400;
    for (let i = 0; i < items.length; i++) {
      const natur = x0 + i * schritt;
      const p = ((natur - o + schritt) % P + P) % P - schritt;
      items[i].style.transform = `translate3d(${(p - natur).toFixed(2)}px,0,0)`;
    }
  };

  // So viele Kopien der Liste, dass die Runde breiter ist als die Leiste plus zwei Storys (sonst entstünden Lücken).
  // Handy, iPad, üblicher Desktop: eine Kopie (18 Storys); sehr breite Bildschirme: mehr.
  const messen = () => {
    if (!items.length) { el.innerHTML = STORIES.map(storyHTML).join(''); items = [...el.children]; kopien = 1; }
    items.forEach(it => { it.style.transform = ''; });
    schritt = items.length > 1 ? items[1].offsetLeft - items[0].offsetLeft : items[0].offsetWidth;
    const noetig = Math.max(1, Math.ceil((el.clientWidth + 2 * schritt) / (STORIES.length * schritt)));
    if (noetig !== kopien) {
      kopien = noetig;
      el.innerHTML = Array.from({ length: kopien }, () => STORIES).flat().map(storyHTML).join('');
      items = [...el.children];
    }
    x0 = items[0].offsetLeft;
    P = items.length * schritt;
    zeichnen();
  };
  const neuMessen = () => { const phase = schritt ? o / schritt : 0; stopp(); messen(); o = phase * schritt; zeichnen(); };

  // ---- Bewegung: Ausrollen nach dem Wischen und weiche Fahrt für Pfeile/Fokus ----
  let raf = 0, v = 0, ziel = null, fahrtStart = 0, fahrtVon = 0, fahrtDauer = 0, letzteZeit = 0;
  const stopp = () => { cancelAnimationFrame(raf); raf = 0; v = 0; ziel = null; };
  const schleife = t => {
    if (ziel !== null) {                                   // Fahrt zu einem Ziel (Pfeile, Fokus)
      const k = Math.min(1, Math.max(0, (t - fahrtStart) / fahrtDauer));
      o = fahrtVon + (ziel - fahrtVon) * (1 - Math.pow(1 - k, 3));
      zeichnen();
      if (k < 1) { raf = requestAnimationFrame(schleife); return; }
      ziel = null; raf = 0; return;
    }
    const dt = Math.min(40, Math.max(0, t - letzteZeit)); letzteZeit = t;   // Ausrollen wie in iOS: Tempo nimmt stetig ab
    // Abbremsen: 0.9965 je ms – ein schneller Wisch rollt gut eine Sekunde aus (0.998 wie bei iOS wirkte hier zu lang und
    // zäh); Schluss, sobald kaum noch Bewegung zu sehen ist (unter 0,05 px/ms ≈ 1 px pro Bild), statt lange nachzukriechen
    o += v * dt; v *= Math.pow(0.9965, dt);
    zeichnen();
    if (Math.abs(v) > 0.05) raf = requestAnimationFrame(schleife); else { v = 0; raf = 0; }
  };
  const ausrollen = tempo => {
    stopp(); v = tempo;
    if (Math.abs(v) <= 0.05 || ruhig.matches) { v = 0; return; }
    letzteZeit = performance.now(); raf = requestAnimationFrame(schleife);
  };
  const fahren = (um, dauer = 380) => {
    const von = ziel !== null ? ziel : o;               // schnelle Klickfolge: vom bisherigen Ziel aus weiter
    stopp();
    if (ruhig.matches) { o = von + um; zeichnen(); return; }
    fahrtVon = o; ziel = von + um; fahrtStart = performance.now(); fahrtDauer = dauer;
    raf = requestAnimationFrame(schleife);
  };

  let rafZ = 0;
  const zeichnenBald = () => { if (!rafZ) rafZ = requestAnimationFrame(() => { rafZ = 0; zeichnen(); }); };

  // ---- Wischen (Finger, Stift) ----
  let zeiger = null, startX = 0, startY = 0, startO = 0, gezogen = false, gestoppt = false, proben = [];
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || zeiger !== null) return;
    gestoppt = !!raf;                                    // Antippen während des Ausrollens hält nur an, öffnet kein Profil
    stopp();
    zeiger = e.pointerId; startX = e.clientX; startY = e.clientY; startO = o; gezogen = false;
    proben = [{ t: e.timeStamp, x: e.clientX }];
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== zeiger) return;
    const dx = e.clientX - startX;
    if (!gezogen && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(e.clientY - startY)) {
      gezogen = true;
      try { el.setPointerCapture(zeiger); } catch {}
    }
    if (!gezogen) return;
    o = startO - dx; zeichnenBald();   // höchstens einmal pro Bild zeichnen, auch wenn mehrere Bewegungen eintreffen
    proben.push({ t: e.timeStamp, x: e.clientX });
    while (proben.length > 2 && e.timeStamp - proben[0].t > 100) proben.shift();
  });
  const loslassen = e => {
    if (e.pointerId !== zeiger) return;
    zeiger = null;
    if (!gezogen) return;
    cancelAnimationFrame(rafZ); rafZ = 0; zeichnen();
    const a = proben[0], b = proben[proben.length - 1];
    const ruhte = e.timeStamp - b.t > 60;                // Finger zuletzt still gehalten: kein Schwung
    ausrollen(!ruhte && b.t > a.t ? -(b.x - a.x) / (b.t - a.t) : 0);
  };
  el.addEventListener('pointerup', loslassen);
  el.addEventListener('pointercancel', loslassen);       // z. B. der Browser übernimmt senkrechtes Scrollen
  // Nach dem Wischen (oder Anhalten) kein Profil öffnen
  el.addEventListener('click', e => {
    if (gezogen || gestoppt) { e.preventDefault(); e.stopPropagation(); }
    gezogen = gestoppt = false;
  }, true);

  // ---- Mausrad / Trackpad: nur waagerechte Bewegung, senkrecht scrollt weiter die Seite ----
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    stopp();
    o += e.deltaX * (e.deltaMode === 1 ? 16 : 1); zeichnen();
  }, { passive: false });

  // ---- Tastatur: per Tab erreichte Story vollständig ins Bild holen ----
  el.addEventListener('focusin', e => {
    const it = e.target.closest('.story'); if (!it) return;
    el.scrollLeft = 0;                                   // der Browser soll nichts selbst verschieben
    const r = it.getBoundingClientRect(), box = el.getBoundingClientRect();
    if (r.left < box.left) fahren(r.left - box.left - schritt / 2);
    else if (r.right > box.right) fahren(r.right - box.right + schritt / 2);
  });

  // Größenänderung (Drehen, Fenster): Position in Storys beibehalten. Nur bei geänderter Breite – auf iPad/iPhone
  // ändert sich beim Scrollen ständig die Höhe (Adressleiste).
  let breiteVorher = innerWidth;
  window.addEventListener('resize', () => {
    if (innerWidth === breiteVorher) return;
    breiteVorher = innerWidth;
    neuMessen();
  });

  // Pfeil-Buttons für die Maus: blättern um so viele ganze Kandidaten, wie sichtbar sind (abzüglich einem, damit man sich orientieren kann).
  const wrapEl = el.parentElement;   // .stories-wrap
  wrapEl.insertAdjacentHTML('beforeend',
    `<button class="pfeil pfeil-l" type="button" aria-label="Vorherige Kandidat*innen">${PFEIL_L}</button>` +
    `<button class="pfeil pfeil-r" type="button" aria-label="Weitere Kandidat*innen">${PFEIL_R}</button>`);
  const blaettern = dir => fahren(dir * Math.max(1, Math.floor(el.clientWidth / schritt) - 1) * schritt);
  wrapEl.querySelector('.pfeil-l').addEventListener('click', () => blaettern(-1));
  wrapEl.querySelector('.pfeil-r').addEventListener('click', () => blaettern(1));

  messen();   // Start: erste Story ganz links
  if (document.fonts) document.fonts.ready.then(neuMessen);   // Maße können sich mit den Schriften noch ändern
})();

   Alle Größen in cqw (1 % der App-Breite). */
const PAD = 5;               // seitlicher Rand der Textfläche (muss zum .overlay-Padding passen)
const HEAD_MAX = 14.3;        // größte erlaubte Schriftgröße der Forderung (zweizeilig)
const HEAD_MIN = 7.07;        // kleinste gewünschte Größe zweizeilig (≈ 10 % unter „Flächendeckendes Radwegenetz aufbauen“ mit 7,86); darunter wird dreizeilig gesetzt
const HEAD_MAX_3 = HEAD_MAX * 2 / 3;   // größte Schriftgröße dreizeilig: der Block wird so nie höher als eine zweizeilige Forderung in Maximalgröße
const SEMI_BONUS = 10;       // Strichpunkt gilt als bevorzugte Umbruchstelle, wenn er bis ca. 10 Zeichen neben dem Ideal liegt

// Text in genau n möglichst gleich lange Zeilen teilen (nur an Leerzeichen; Optimierung per Dynamischer Programmierung)
function splitLines(t, n) {
  t = t.replace(/(\d) (?=\S)/g, '$1\u00A0');   // „16 Euro“ nicht trennen
  const words = t.split(' '), m = words.length;
  if (m <= n) return [...words, ...Array(n - m).fill('')];
  const pre = [0];
  words.forEach(w => pre.push(pre[pre.length - 1] + w.length + 1));
  const ideal = t.length / n;
  const cost = (i, j, last) =>
    (pre[j] - pre[i] - 1 - ideal) ** 2 - (!last && words[j - 1].endsWith(';') ? SEMI_BONUS ** 2 : 0);
  const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(Infinity));
  const from = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
  dp[0][0] = 0;
  for (let k = 1; k <= n; k++)
    for (let j = k; j <= m; j++)
      for (let i = k - 1; i < j; i++) {
        const c = dp[k - 1][i] + cost(i, j, k === n);
        if (c < dp[k][j]) { dp[k][j] = c; from[k][j] = i; }
      }
  const lines = [];
  for (let k = n, j = m; k >= 1; k--) { const i = from[k][j]; lines.unshift(words.slice(i, j).join(' ')); j = i; }
  return lines;
}
const bodyText = t => t

   Drei Arten (Tabelle EXPORT_ARTEN):
     beitrag – das fertig gesetzte Bild (Foto, Verlauf, Text, Logos) aus EXPORT_BILDER, erzeugt von export_thesen.py.
               Mehrfach verwendete Forderungen: die a/b-Fassung mit dem Logo der Gruppe dieses Beitrags (exportName).
               Es wird zuerst .jpg, dann .png gesucht; fehlt die Datei, kommt ein Hinweis statt eines falschen Bildes.
     bild    – nur das Hintergrundbild, als PNG-Fassung aus EXPORT_BILDER (0001.png …; im Feed wird die JPG-Fassung aus Hintergrundbilder/ gezeigt).
               Fehlt die PNG-Datei, kommt ein Hinweis.
     text    – nur der Text (Forderung und Erklärung).
   Bilder gehen auf Handy/Tablet über das systemeigene Teilen-Menü (Web Share API mit Datei; braucht https und einen Tipp), am PC und als Rückfall als Download.
   Text kommt direkt in die Zwischenablage: als formatierter Text (Forderung und **-Markierungen fett), wo das Ziel ihn annimmt,
   und zusätzlich als reiner Text ohne Markierungen für Ziele ohne Formatierung.
   Die Bilddatei wird schon beim Auswählen geladen, damit das Teilen-Menü beim Tipp auf „Exportieren“ sofort aufgeht (iOS verlangt das). */
const dateiName = u => String(u).split('?')[0].split('/').pop();

const hintergrundPng = f => EXPORT_BILDER.ordner + String(f.img).replace(/\.[^.]+$/, '') + '.png';   // 0001.jpg → export-bilder/0001.png

const exCache = new Map();   // Bild-Adresse → Promise auf die geladene Datei (oder null)
function exDatei(url) {
  if (!exCache.has(url)) {
    exCache.set(url, (async () => {
      try {
        const r = await fetch(url);
        if (!r.ok) throw r.status;
        // Manche Hoster liefern für fehlende Dateien eine HTML-Seite mit Status 200 – das ist kein Bild
        if (/^text\/html/i.test(r.headers.get('Content-Type') || '')) throw 404;
        const b = await r.blob(), name = dateiName(url);
        return new File([b], name, { type: b.type.startsWith('image/') ? b.type : /\.png$/i.test(name) ? 'image/png' : 'image/jpeg' });
      } catch {
        exCache.delete(url);   // nächster Versuch lädt neu
        return null;           // z. B. beim Öffnen per file:// – dann greift der Download-Weg
      }
    })());
  }
  return exCache.get(url);
}

// Erste ladbare Datei aus einer Liste von Adressen: { url, file } oder null
async function exErste(urls) {
  for (const url of urls) {
    const file = await exDatei(url);
    if (file) return { url, file };
  }
  return null;
}

// Rückgabe: true = erledigt, false = Teilen-Menü wurde geschlossen bzw. Datei fehlt (Dialog bleibt offen)
async function exportiereBild(urls) {
  const gefunden = await exErste(urls);
  if (!gefunden && location.protocol !== 'file:') {   // per file:// lässt sich nichts vorab laden, dort greift unten der direkte Download
    toast('Bilddatei noch nicht vorhanden: ' + dateiName(urls[0]).replace(/\.[^.]+$/, ''));
    return false;
  }
  const url = gefunden ? gefunden.url : urls[0], file = gefunden && gefunden.file;
  // Teilen-Menü nur auf Handy/Tablet (Touch ohne Maus). Am PC bietet das System-Menü (z. B. Windows „Freigeben“)
  // keinen Download an – dort wird die Datei direkt heruntergeladen.
  const mobil = matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (mobil && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) {
      if (e.name === 'AbortError') return false;
      console.warn('Teilen fehlgeschlagen, Bild wird heruntergeladen:', e);
    }
  }
  const a = document.createElement('a');
  a.href = file ? URL.createObjectURL(file) : url;
  a.download = dateiName(url);
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (file) setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast('Download gestartet: ' + dateiName(url));
  return true;
}
// Kopiert den Text in die Zwischenablage. Reihenfolge der Wege (der erste, der klappt, gewinnt):
//   1. Clipboard API mit HTML und reinem Text (moderne Browser; Hervorhebungen fett)
//   2. Kopieren einer unsichtbaren formatierten Textauswahl (ältere Browser; ebenfalls fett)
//   3. nur reiner Text, 4. Eingabefenster zum manuellen Kopieren
// Muss direkt aus dem Tipp auf „Exportieren“ heraus laufen, sonst verweigern Browser den Zugriff.
async function exportiereText({ rein, html }) {
  const geschafft = () => { toast('Text kopiert'); return true; };
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([rein], { type: 'text/plain' }),
      })]);
      return geschafft();
    } catch (e) { console.warn('Formatiertes Kopieren nicht möglich:', e); }
  }
  if (kopiereAuswahl(html, rein)) return geschafft();
  try { await navigator.clipboard.writeText(rein); return geschafft(); }
  catch { window.prompt('Text zum Kopieren:', rein); }
  return true;
}
function kopiereAuswahl(html, rein) {
  const el = document.createElement('div');
  el.contentEditable = 'true';
  el.style.cssText = 'position:fixed;left:-9999px;top:0;white-space:pre-wrap';
  el.innerHTML = html;
  document.body.appendChild(el);
  const sel = getSelection(), alt = sel.rangeCount ? sel.getRangeAt(0) : null;
  const range = document.createRange();
  range.selectNodeContents(el);
  sel.removeAllRanges(); sel.addRange(range);
  const beimKopieren = e => {   // reinen Text sauber mitgeben (ohne doppelte Leerzeilen aus den Absätzen)
    e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', rein);
    e.preventDefault();
  };
  document.addEventListener('copy', beimKopieren, { once: true });
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  document.removeEventListener('copy', beimKopieren);
  sel.removeAllRanges(); if (alt) sel.addRange(alt);
  el.remove();
  return ok;
}

   Tipp auf das Herz (1200.svg) wechselt zu 1200-aktiv.svg und spielt die Animation ab.
   Gezählt wird global über einen Cloudflare Worker (Ordner herzen-worker): Der Server zählt.
   Der Browser merkt sich nur sein Token (Berechtigung, Herzen zu vergeben) und welche Beiträge

const HEARTS_API = 'https://herzen.DEIN-NAME.workers.dev';   // Worker unter eigener Domain (Route /api/*): '' eintragen


const hearts = { counts: store.get(HK.counts, {}), mine: new Set(store.get(HK.mine, [])), busy: new Set() };

new Image().src = POSTS[0].actions.find(a => a.iconOn).iconOn;   // Symbol vorladen, damit beim ersten Tipp nichts flackert

// Zeigt Zustand und Zahl eines Herz-Buttons. animate = true nur direkt nach einem Tipp.
function paintLike(btn, animate = false) {
  const id = btn.dataset.post, on = hearts.mine.has(id);
  const img = btn.querySelector('img');
  const countEl = btn.querySelector('.act-count');
  btn.setAttribute('aria-pressed', String(on));
  const src = on ? btn.dataset.iconOn : btn.dataset.icon;
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  if (countEl) countEl.textContent = (START[id] ?? 0) + (hearts.counts[id] ?? 0);
  if (!animate) return;
  btn.classList.remove('pop', 'unpop');
  void btn.offsetWidth;                       // Animation neu starten
  btn.classList.add(on ? 'pop' : 'unpop');
  if (on) {
    btn.querySelector('.heart-burst')?.remove();

    burst.innerHTML = Array.from({ length: 6 }, (_, i) => `<i style="--a:${i * 60 + 30}deg"></i>`).join('');
    btn.appendChild(burst);
    setTimeout(() => burst.remove(), 700);
  }
}
const paintHearts = () => document.querySelectorAll('.act.like').forEach(b => paintLike(b));

async function loadHearts() {
  try {
    const r = await fetch(HEARTS_API + '/api/hearts');
    if (!r.ok) throw r.status;
    hearts.counts = (await r.json()).counts;
    store.set(HK.counts, hearts.counts);
  } catch { /* offline oder Limit erreicht: die zuletzt bekannten Zahlen bleiben stehen */ }
  paintHearts();
}

async function toggleLike(btn) {
  const id = btn.dataset.post;
  if (hearts.busy.has(id)) return;
  hearts.busy.add(id);

  const want = !hearts.mine.has(id), before = hearts.counts[id] ?? 0;
  want ? hearts.mine.add(id) : hearts.mine.delete(id);          // sofort anzeigen, danach mit dem Server abgleichen
  hearts.counts[id] = Math.max(0, before + (want ? 1 : -1));
  paintLike(btn, true);

  try {
    const r = await fetch(HEARTS_API + '/api/heart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Voter': store.get(HK.token, '') },
      body: JSON.stringify({ post: id, on: want }),
    });
    if (!r.ok) throw r.status;
    const d = await r.json();
    if (d.token) store.set(HK.token, d.token);
    hearts.counts[id] = d.n;
  } catch (err) {
    want ? hearts.mine.delete(id) : hearts.mine.add(id);        // zurückrollen
    hearts.counts[id] = before;
    toast(err === 429 ? 'Gerade sehr viele Herzen – bitte kurz warten' : 'Das Liken der Beiträge ist noch in Arbeit...');
  } finally {
    hearts.busy.delete(id);
    store.set(HK.mine, [...hearts.mine]);
    store.set(HK.counts, hearts.counts);
    paintLike(btn);
  }
}
